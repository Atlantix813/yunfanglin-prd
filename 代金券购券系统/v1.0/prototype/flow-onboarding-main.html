<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">商家进件流程（主链）</h1><p class="sub">串行主线：核对联系信息 → 平台审核 → 账户验证（条件步骤）→ 签约 → 开通权限；超管侧操作经统一链接按状态分步引导。</p><svg width="100%" viewBox="0 0 1197 2140" role="img" aria-labelledby="onboarding-main-title onboarding-main-desc"><title id="onboarding-main-title">商家进件流程（主链）</title><desc id="onboarding-main-desc">提交进件后：超管扫统一链接核对联系信息（不影响审核）；平台审核 1-3 个工作日；审核通过后判定是否需账户验证（法人本人当超管免验证，需验证主体汇款/法人扫码 10 天期限）；验证完成或免验证后签约；签约完成开通权限并回写特约商户号。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 352 80 L 352 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 352 256 L 352 376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 352 432 L 352 552" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 162 608 L 104 608 L 104 752" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 542 608 L 600 608 L 600 752" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 410 808 L 344 808 L 344 952" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 790 808 L 856 808 L 856 1128" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 344 1008 L 344 1050 L 856 1050 L 856 1128" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 856 1184 L 856 1304" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 692 1360 L 626 1360 L 626 1504" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1020 1360 L 1086 1360 L 1086 1680" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 626 1560 L 626 1602 L 1036 1602 L 1036 1680" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1061 1736 L 1061 1856" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1061 1912 L 1061 2032" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="117" y="588" width="32" height="12" rx="2"/><text class="edge-label" x="133" y="597" text-anchor="middle">驳回</text><rect class="label-mask" x="555" y="588" width="32" height="12" rx="2"/><text class="edge-label" x="571" y="597" text-anchor="middle">通过</text><rect class="label-mask" x="357" y="788" width="40" height="12" rx="2"/><text class="edge-label" x="377" y="797" text-anchor="middle">需验证</text><rect class="label-mask" x="803" y="788" width="40" height="12" rx="2"/><text class="edge-label" x="823" y="797" text-anchor="middle">免验证</text><rect class="label-mask" x="639" y="1340" width="40" height="12" rx="2"/><text class="edge-label" x="659" y="1349" text-anchor="middle">未签约</text><rect class="label-mask" x="1033" y="1340" width="40" height="12" rx="2"/><text class="edge-label" x="1053" y="1349" text-anchor="middle">已签约</text><rect class="start" x="280" y="24" width="144" height="56" rx="28"/><text class="node-title" x="352" y="48" text-anchor="middle">运营发起进件</text><text class="node-sub" x="352" y="66" text-anchor="middle">填写结算卡与超级管理员</text><rect class="step" x="268" y="200" width="168" height="56" rx="6"/><text class="node-title" x="352" y="224" text-anchor="middle">提交 API 进件申请单</text><text class="node-sub" x="352" y="242" text-anchor="middle">接口同步校验；通过即创建申请单</text><rect class="step" x="258" y="376" width="188" height="56" rx="6"/><text class="node-title" x="352" y="400" text-anchor="middle">核对联系信息</text><text class="node-sub" x="352" y="418" text-anchor="middle">超管扫统一链接绑定微信；不影响审核</text><polygon class="decision" points="352,552 542,608 352,664 162,608"/><text class="node-title" x="352" y="603" text-anchor="middle">申请单状态 == 审核通过？</text><text class="node-sub decision-sub" x="352" y="621" text-anchor="middle">平台审核 1-3 个工作日</text><rect class="error" x="32" y="752" width="144" height="56" rx="6"/><text class="node-title" x="104" y="776" text-anchor="middle">审核驳回</text><text class="node-sub" x="104" y="794" text-anchor="middle">展示原因；重新发起</text><polygon class="decision" points="600,752 790,808 600,864 410,808"/><text class="node-title" x="600" y="803" text-anchor="middle">账户验证状态 == 免验证？</text><text class="node-sub decision-sub" x="600" y="821" text-anchor="middle">审核通过后判定（主体×超管身份）</text><rect class="step" x="262" y="952" width="164" height="56" rx="6"/><text class="node-title" x="344" y="976" text-anchor="middle">完成账户验证</text><text class="node-sub" x="344" y="994" text-anchor="middle">汇款 / 法人扫码（10 天期限）</text><rect class="step" x="784" y="1128" width="144" height="56" rx="6"/><text class="node-title" x="856" y="1152" text-anchor="middle">进入待签约</text><text class="node-sub" x="856" y="1170" text-anchor="middle">验证完成或免验证后到达</text><polygon class="decision" points="856,1304 1020,1360 856,1416 692,1360"/><text class="node-title" x="856" y="1355" text-anchor="middle">签约状态 == 已签约？</text><text class="node-sub decision-sub" x="856" y="1373" text-anchor="middle">超管在统一链接完成签约</text><rect class="step" x="554" y="1504" width="144" height="56" rx="6"/><text class="node-title" x="626" y="1528" text-anchor="middle">等待超管签约</text><text class="node-sub" x="626" y="1546" text-anchor="middle">同一链接按状态引导</text><rect class="step" x="989" y="1680" width="144" height="56" rx="6"/><text class="node-title" x="1061" y="1704" text-anchor="middle">开通权限中</text><text class="node-sub" x="1061" y="1722" text-anchor="middle">系统自动约 30 分钟</text><rect class="success" x="989" y="1856" width="144" height="56" rx="6"/><text class="node-title" x="1061" y="1880" text-anchor="middle">特约商户号回写</text><text class="node-sub" x="1061" y="1898" text-anchor="middle">进件完成；可发付费券</text><rect class="end" x="989" y="2032" width="144" height="44" rx="22"/><text class="node-title end-text" x="1061" y="2058" text-anchor="middle">流程结束</text></svg></main></body></html>
