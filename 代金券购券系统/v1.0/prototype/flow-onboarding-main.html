<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">商家进件流程（主链）</h1><p class="sub">串行主线：核对联系信息 → 平台审核 → 账户验证（条件步骤）→ 签约 → 开通权限；超管侧操作经统一链接按状态分步引导。</p><svg width="100%" viewBox="0 0 1283 2508" role="img" aria-labelledby="onboarding-main-title onboarding-main-desc"><title id="onboarding-main-title">商家进件流程（主链）</title><desc id="onboarding-main-desc">提交进件后：超管扫统一链接核对联系信息（不影响审核）；平台审核 1-3 个工作日；审核通过后判定是否需账户验证（法人本人当超管免验证，需验证主体汇款/法人扫码 10 天期限）；验证完成或免验证后签约；签约完成开通权限并回写特约商户号。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 368 80 L 368 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 368 268 L 368 388" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 368 468 L 368 588" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 368 656 L 368 776" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 178 846 L 120 846 L 120 1004" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 558 846 L 616 846 L 616 1004" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 412 1074 L 346 1074 L 346 1232" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 820 1074 L 886 1074 L 886 1420" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 346 1300 L 346 1342 L 886 1342 L 886 1420" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 886 1488 L 886 1608" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 670 1678 L 604 1678 L 604 1836" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1102 1678 L 1168 1678 L 1168 2024" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 604 1904 L 604 1946 L 1118 1946 L 1118 2024" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1143 2092 L 1143 2212" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1143 2280 L 1143 2400" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="133" y="826" width="32" height="12" rx="2"/><text class="edge-label" x="149" y="835" text-anchor="middle">驳回</text><rect class="label-mask" x="571" y="826" width="32" height="12" rx="2"/><text class="edge-label" x="587" y="835" text-anchor="middle">通过</text><rect class="label-mask" x="359" y="1054" width="40" height="12" rx="2"/><text class="edge-label" x="379" y="1063" text-anchor="middle">需验证</text><rect class="label-mask" x="833" y="1054" width="40" height="12" rx="2"/><text class="edge-label" x="853" y="1063" text-anchor="middle">免验证</text><rect class="label-mask" x="617" y="1658" width="40" height="12" rx="2"/><text class="edge-label" x="637" y="1667" text-anchor="middle">未签约</text><rect class="label-mask" x="1115" y="1658" width="40" height="12" rx="2"/><text class="edge-label" x="1135" y="1667" text-anchor="middle">已签约</text><rect class="start" x="296" y="24" width="144" height="56" rx="28"/><text class="node-title" x="368" y="48" text-anchor="middle">运营发起进件</text><text class="node-sub" x="368" y="64" text-anchor="middle">填写结算卡与超级管理员</text><rect class="step" x="250" y="200" width="236" height="68" rx="6"/><text class="node-title" x="368" y="224" text-anchor="middle">提交 API 进件申请单</text><text class="node-sub" x="368" y="240" text-anchor="middle">接口同步校验：通过 → [申请单状态=审核中]；</text><text class="node-sub" x="368" y="252" text-anchor="middle">不通过 → [申请单状态=编辑中]（重新提交覆盖）</text><rect class="step" x="290" y="388" width="156" height="80" rx="6"/><text class="node-title" x="368" y="412" text-anchor="middle">核对联系信息</text><text class="node-sub" x="368" y="428" text-anchor="middle">超管扫统一链接绑定微信；不影响审核；</text><text class="node-sub" x="368" y="440" text-anchor="middle">[申请单状态=审核中]（不变）</text><rect class="step" x="296" y="588" width="144" height="68" rx="6"/><text class="node-title" x="368" y="612" text-anchor="middle">微信人工审核</text><text class="node-sub" x="368" y="628" text-anchor="middle">1-3 个工作日；审核动作触发状态变更</text><polygon class="decision" points="368,776 558,846 368,916 178,846"/><text class="node-title" x="368" y="841" text-anchor="middle">申请单状态 == 审核通过？</text><text class="node-sub decision-sub" x="368" y="856" text-anchor="middle">审核动作完成后判定</text><rect class="error" x="32" y="1004" width="176" height="68" rx="6"/><text class="node-title" x="120" y="1028" text-anchor="middle">审核驳回</text><text class="node-sub" x="120" y="1044" text-anchor="middle">[申请单状态=已驳回]；展示原因；</text><text class="node-sub" x="120" y="1056" text-anchor="middle">同编号覆盖重提</text><polygon class="decision" points="616,1004 820,1074 616,1144 412,1074"/><text class="node-title" x="616" y="1069" text-anchor="middle">申请单状态 == 待账户验证？</text><text class="node-sub decision-sub" x="616" y="1084" text-anchor="middle">审核通过后官方判定（主体×超管身份）</text><rect class="step" x="260" y="1232" width="172" height="68" rx="6"/><text class="node-title" x="346" y="1256" text-anchor="middle">完成账户验证</text><text class="node-sub" x="346" y="1272" text-anchor="middle">汇款 / 法人扫码（10 天期限）；</text><text class="node-sub" x="346" y="1284" text-anchor="middle">完成 → [申请单状态=待签约]</text><rect class="step" x="814" y="1420" width="144" height="68" rx="6"/><text class="node-title" x="886" y="1444" text-anchor="middle">进入待签约</text><text class="node-sub" x="886" y="1460" text-anchor="middle">[申请单状态=待签约]；验证完成或免验证后到达</text><polygon class="decision" points="886,1608 1102,1678 886,1748 670,1678"/><text class="node-title" x="886" y="1673" text-anchor="middle">申请单状态 == 开通权限中？</text><text class="node-sub decision-sub" x="886" y="1688" text-anchor="middle">超管在统一链接完成签约，签约完成即触发</text><rect class="step" x="522" y="1836" width="164" height="68" rx="6"/><text class="node-title" x="604" y="1860" text-anchor="middle">等待超管签约</text><text class="node-sub" x="604" y="1876" text-anchor="middle">[申请单状态=待签约]（不变）；</text><text class="node-sub" x="604" y="1888" text-anchor="middle">同一链接按状态引导</text><rect class="step" x="1069" y="2024" width="148" height="68" rx="6"/><text class="node-title" x="1143" y="2048" text-anchor="middle">开通权限中</text><text class="node-sub" x="1143" y="2064" text-anchor="middle">[申请单状态=开通权限中]；</text><text class="node-sub" x="1143" y="2076" text-anchor="middle">系统自动约 30 分钟</text><rect class="success" x="1067" y="2212" width="152" height="68" rx="6"/><text class="node-title" x="1143" y="2236" text-anchor="middle">进件完成</text><text class="node-sub" x="1143" y="2252" text-anchor="middle">[申请单状态=已完成]；特约商户号回写；</text><text class="node-sub" x="1143" y="2264" text-anchor="middle">可发付费券</text><rect class="end" x="1071" y="2400" width="144" height="44" rx="22"/><text class="node-title end-text" x="1143" y="2426" text-anchor="middle">流程结束</text></svg></main></body></html>
