<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">商家进件流程（主链）</h1><p class="sub">串行主线：核对联系信息 → 平台审核 → 账户验证（条件步骤）→ 签约 → 开通权限；超管侧操作经统一链接按状态分步引导。</p><svg width="100%" viewBox="0 0 1347 2316" role="img" aria-labelledby="onboarding-main-title onboarding-main-desc"><title id="onboarding-main-title">商家进件流程（主链）</title><desc id="onboarding-main-desc">提交进件后：超管扫统一链接核对联系信息（不影响审核）；平台审核 1-3 个工作日；审核通过后判定是否需账户验证（法人本人当超管免验证，需验证主体汇款/法人扫码 10 天期限）；验证完成或免验证后签约；签约完成开通权限并回写特约商户号。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 398 80 L 398 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 398 256 L 398 376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 398 432 L 398 552" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 398 608 L 398 728" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 208 784 L 150 784 L 150 928" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 588 784 L 646 784 L 646 928" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 442 984 L 376 984 L 376 1128" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 850 984 L 916 984 L 916 1304" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 376 1184 L 376 1226 L 916 1226 L 916 1304" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 916 1360 L 916 1480" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 700 1536 L 634 1536 L 634 1680" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1132 1536 L 1198 1536 L 1198 1856" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 634 1736 L 634 1778 L 1120 1778 L 1120 1856" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1159 1912 L 1159 2032" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1159 2088 L 1159 2208" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="163" y="764" width="32" height="12" rx="2"/><text class="edge-label" x="179" y="773" text-anchor="middle">驳回</text><rect class="label-mask" x="601" y="764" width="32" height="12" rx="2"/><text class="edge-label" x="617" y="773" text-anchor="middle">通过</text><rect class="label-mask" x="389" y="964" width="40" height="12" rx="2"/><text class="edge-label" x="409" y="973" text-anchor="middle">需验证</text><rect class="label-mask" x="863" y="964" width="40" height="12" rx="2"/><text class="edge-label" x="883" y="973" text-anchor="middle">免验证</text><rect class="label-mask" x="647" y="1516" width="40" height="12" rx="2"/><text class="edge-label" x="667" y="1525" text-anchor="middle">未签约</text><rect class="label-mask" x="1145" y="1516" width="40" height="12" rx="2"/><text class="edge-label" x="1165" y="1525" text-anchor="middle">已签约</text><rect class="start" x="326" y="24" width="144" height="56" rx="28"/><text class="node-title" x="398" y="48" text-anchor="middle">运营发起进件</text><text class="node-sub" x="398" y="66" text-anchor="middle">填写结算卡与超级管理员</text><rect class="step" x="184" y="200" width="428" height="56" rx="6"/><text class="node-title" x="398" y="224" text-anchor="middle">提交 API 进件申请单</text><text class="node-sub" x="398" y="242" text-anchor="middle">接口同步校验：通过 → [申请单状态=审核中]；不通过 → [申请单状态=编辑中]（重新提交覆盖）</text><rect class="step" x="238" y="376" width="320" height="56" rx="6"/><text class="node-title" x="398" y="400" text-anchor="middle">核对联系信息</text><text class="node-sub" x="398" y="418" text-anchor="middle">超管扫统一链接绑定微信；不影响审核；[申请单状态=审核中]（不变）</text><rect class="step" x="304" y="552" width="188" height="56" rx="6"/><text class="node-title" x="398" y="576" text-anchor="middle">微信人工审核</text><text class="node-sub" x="398" y="594" text-anchor="middle">1-3 个工作日；审核动作触发状态变更</text><polygon class="decision" points="398,728 588,784 398,840 208,784"/><text class="node-title" x="398" y="779" text-anchor="middle">申请单状态 == 审核通过？</text><text class="node-sub decision-sub" x="398" y="797" text-anchor="middle">审核动作完成后判定</text><rect class="error" x="32" y="928" width="236" height="56" rx="6"/><text class="node-title" x="150" y="952" text-anchor="middle">审核驳回</text><text class="node-sub" x="150" y="970" text-anchor="middle">[申请单状态=已驳回]；展示原因；同编号覆盖重提</text><polygon class="decision" points="646,928 850,984 646,1040 442,984"/><text class="node-title" x="646" y="979" text-anchor="middle">申请单状态 == 待账户验证？</text><text class="node-sub decision-sub" x="646" y="997" text-anchor="middle">审核通过后官方判定（主体×超管身份）</text><rect class="step" x="230" y="1128" width="292" height="56" rx="6"/><text class="node-title" x="376" y="1152" text-anchor="middle">完成账户验证</text><text class="node-sub" x="376" y="1170" text-anchor="middle">汇款 / 法人扫码（10 天期限）；完成 → [申请单状态=待签约]</text><rect class="step" x="802" y="1304" width="228" height="56" rx="6"/><text class="node-title" x="916" y="1328" text-anchor="middle">进入待签约</text><text class="node-sub" x="916" y="1346" text-anchor="middle">[申请单状态=待签约]；验证完成或免验证后到达</text><polygon class="decision" points="916,1480 1132,1536 916,1592 700,1536"/><text class="node-title" x="916" y="1531" text-anchor="middle">申请单状态 == 开通权限中？</text><text class="node-sub decision-sub" x="916" y="1549" text-anchor="middle">超管在统一链接完成签约，签约完成即触发</text><rect class="step" x="510" y="1680" width="248" height="56" rx="6"/><text class="node-title" x="634" y="1704" text-anchor="middle">等待超管签约</text><text class="node-sub" x="634" y="1722" text-anchor="middle">[申请单状态=待签约]（不变）；同一链接按状态引导</text><rect class="step" x="1043" y="1856" width="232" height="56" rx="6"/><text class="node-title" x="1159" y="1880" text-anchor="middle">开通权限中</text><text class="node-sub" x="1159" y="1898" text-anchor="middle">[申请单状态=开通权限中]；系统自动约 30 分钟</text><rect class="success" x="1035" y="2032" width="248" height="56" rx="6"/><text class="node-title" x="1159" y="2056" text-anchor="middle">进件完成</text><text class="node-sub" x="1159" y="2074" text-anchor="middle">[申请单状态=已完成]；特约商户号回写；可发付费券</text><rect class="end" x="1087" y="2208" width="144" height="44" rx="22"/><text class="node-title end-text" x="1159" y="2234" text-anchor="middle">流程结束</text></svg></main></body></html>
