<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">到店核销流程</h1><p class="sub">商家扫码核销，校验归属、状态和有效期。</p><svg width="100%" viewBox="0 0 1328 1636" role="img" aria-labelledby="verify-title verify-desc"><title id="verify-title">到店核销流程</title><desc id="verify-desc">商家扫描居民核销码，按订单归属、订单状态和有效期逐级校验，核销成功后区分付费券（分账）和免费券（无资金流）。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 322 80 L 322 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 170 256 L 104 256 L 104 400" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 474 256 L 532 256 L 532 400" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 368 456 L 294 456 L 294 600" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 696 456 L 762 456 L 762 600" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 628 656 L 562 656 L 562 800" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 896 656 L 970 656 L 970 800" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 970 1032 L 970 1152" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 818 1208 L 752 1208 L 752 1352" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1122 1208 L 1188 1208 L 1188 1352" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 752 1408 L 752 1528" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1188 1408 L 1188 1450 L 802 1450 L 802 1528" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 970 856 L 970 976" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="117" y="236" width="40" height="12" rx="2"/><text class="edge-label" x="137" y="245" text-anchor="middle">非本店</text><rect class="label-mask" x="487" y="236" width="32" height="12" rx="2"/><text class="edge-label" x="503" y="245" text-anchor="middle">本店</text><rect class="label-mask" x="307" y="436" width="48" height="12" rx="2"/><text class="edge-label" x="331" y="445" text-anchor="middle">非待使用</text><rect class="label-mask" x="709" y="436" width="40" height="12" rx="2"/><text class="edge-label" x="729" y="445" text-anchor="middle">待使用</text><rect class="label-mask" x="575" y="636" width="40" height="12" rx="2"/><text class="edge-label" x="595" y="645" text-anchor="middle">已过期</text><rect class="label-mask" x="909" y="636" width="48" height="12" rx="2"/><text class="edge-label" x="933" y="645" text-anchor="middle">有效期内</text><rect class="label-mask" x="765" y="1188" width="40" height="12" rx="2"/><text class="edge-label" x="785" y="1197" text-anchor="middle">付费券</text><rect class="label-mask" x="1135" y="1188" width="40" height="12" rx="2"/><text class="edge-label" x="1155" y="1197" text-anchor="middle">免费券</text><rect class="start" x="250" y="24" width="144" height="56" rx="28"/><text class="node-title" x="322" y="48" text-anchor="middle">商家扫码核销码</text><text class="node-sub" x="322" y="66" text-anchor="middle">商家端核销页</text><polygon class="decision" points="322,200 474,256 322,312 170,256"/><text class="node-title" x="322" y="251" text-anchor="middle">订单归属 == 本店？</text><text class="node-sub decision-sub" x="322" y="269" text-anchor="middle">核销码关联商家 ID</text><rect class="error" x="32" y="400" width="144" height="56" rx="6"/><text class="node-title" x="104" y="424" text-anchor="middle">非本店券</text><text class="node-sub" x="104" y="442" text-anchor="middle">提示：该券不属于本店</text><polygon class="decision" points="532,400 696,456 532,512 368,456"/><text class="node-title" x="532" y="451" text-anchor="middle">订单状态 == 待使用？</text><text class="node-sub decision-sub" x="532" y="469" text-anchor="middle">voucher_order.status</text><rect class="error" x="222" y="600" width="144" height="56" rx="6"/><text class="node-title" x="294" y="624" text-anchor="middle">订单状态异常</text><text class="node-sub" x="294" y="642" text-anchor="middle">已核销/已退款/已过期</text><polygon class="decision" points="762,600 896,656 762,712 628,656"/><text class="node-title" x="762" y="651" text-anchor="middle">是否在有效期内？</text><text class="node-sub decision-sub" x="762" y="669" text-anchor="middle">有效期结束时间</text><rect class="error" x="490" y="800" width="144" height="56" rx="6"/><text class="node-title" x="562" y="824" text-anchor="middle">已过期</text><text class="node-sub" x="562" y="842" text-anchor="middle">提示：该券已过期不可使用</text><rect class="step" x="882" y="800" width="176" height="56" rx="6"/><text class="node-title" x="970" y="824" text-anchor="middle">写入订单状态=已核销</text><text class="node-sub" x="970" y="842" text-anchor="middle">voucher_order.status=[已核销]</text><rect class="step" x="898" y="976" width="144" height="56" rx="6"/><text class="node-title" x="970" y="1000" text-anchor="middle">写入核销记录</text><text class="node-sub" x="970" y="1018" text-anchor="middle">核销人/核销时间</text><polygon class="decision" points="970,1152 1122,1208 970,1264 818,1208"/><text class="node-title" x="970" y="1203" text-anchor="middle">券类型 == 付费券？</text><text class="node-sub decision-sub" x="970" y="1221" text-anchor="middle">voucher_goods.type</text><rect class="step" x="644" y="1352" width="216" height="56" rx="6"/><text class="node-title" x="752" y="1376" text-anchor="middle">创建分账记录</text><text class="node-sub" x="752" y="1394" text-anchor="middle">profit_sharing_record.status=[待分账]</text><rect class="step" x="1112" y="1352" width="152" height="56" rx="6"/><text class="node-title" x="1188" y="1376" text-anchor="middle">免费券核销终结</text><text class="node-sub" x="1188" y="1394" text-anchor="middle">不创建分账记录，仅核销记录</text><rect class="end" x="705" y="1528" width="144" height="44" rx="22"/><text class="node-title end-text" x="777" y="1554" text-anchor="middle">流程结束</text></svg></main></body></html>
