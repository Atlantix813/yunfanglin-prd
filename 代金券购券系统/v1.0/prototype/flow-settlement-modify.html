26" y="840" text-anchor="middle">新账户生效</text><text class="node-sub" x="426" y="858" text-anchor="middle">回写商家主记录当前结算账户；核对基线更新</text><rect class="end" x="354" y="992" width="144" height="44" rx="22"/><text class="node-title end-text" x="426" y="1018" text-anchor="middle">流程结束</text></svg></main></body></html>
