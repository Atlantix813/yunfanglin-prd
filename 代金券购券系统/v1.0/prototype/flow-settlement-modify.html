<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">结算账户修改子流程</h1><p class="sub">平台确认商家改卡申请 → 微信审核（可打 0.01 元验证）→ 驳回重发 / 成功回写；每天限 5 次。</p><svg width="100%" viewBox="0 0 780 1136" role="img" aria-labelledby="settlement-modify-title settlement-modify-desc"><title id="settlement-modify-title">结算账户修改子流程</title><desc id="settlement-modify-desc">商家主体级操作：平台侧确认商家改卡申请后调微信修改结算账户接口；微信受理生成修改申请单（审核中，期间可能打 0.01 元验证新卡）；审核驳回按原因重新发起（新申请单，每天限 5 次）；审核成功新账户生效并回写商家主记录当前结算账户。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 380 80 L 380 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 380 268 L 380 388" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 380 456 L 380 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 182 658 L 124 658 L 124 840" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 578 658 L 636 658 L 636 828" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 124 908 L 124 1028" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 636 908 L 636 950 L 174 950 L 174 1028" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="137" y="638" width="32" height="12" rx="2"/><text class="edge-label" x="153" y="647" text-anchor="middle">驳回</text><rect class="label-mask" x="591" y="638" width="32" height="12" rx="2"/><text class="edge-label" x="607" y="647" text-anchor="middle">成功</text><rect class="start" x="308" y="24" width="144" height="56" rx="28"/><text class="node-title" x="380" y="48" text-anchor="middle">商家申请改卡</text><text class="node-sub" x="380" y="64" text-anchor="middle">商家列表【修改结算账户】</text><rect class="step" x="304" y="200" width="152" height="68" rx="6"/><text class="node-title" x="380" y="224" text-anchor="middle">创建结算账户修改记录</text><text class="node-sub" x="380" y="240" text-anchor="middle">[申请状态=审核中]；写入修改申请单号</text><rect class="step" x="286" y="388" width="188" height="68" rx="6"/><text class="node-title" x="380" y="412" text-anchor="middle">调微信修改结算账户接口</text><text class="node-sub" x="380" y="428" text-anchor="middle">平台确认后提交；微信受理；</text><text class="node-sub" x="380" y="440" text-anchor="middle">审核期间可能向新卡打款 0.01 元验证</text><polygon class="decision" points="380,576 578,658 380,740 182,658"/><text class="node-title" x="380" y="653" text-anchor="middle">申请状态 == 审核成功？</text><text class="node-sub decision-sub" x="380" y="668" text-anchor="middle">审核动作完成后判定；</text><text class="node-sub decision-sub" x="380" y="681" text-anchor="middle">大部分 1 个自然日，最长 5 个工作日</text><rect class="error" x="32" y="840" width="184" height="68" rx="6"/><text class="node-title" x="124" y="864" text-anchor="middle">审核驳回</text><text class="node-sub" x="124" y="880" text-anchor="middle">[申请状态=审核驳回]；带驳回原因；</text><text class="node-sub" x="124" y="892" text-anchor="middle">重新发起（新申请单）</text><rect class="success" x="556" y="828" width="160" height="80" rx="6"/><text class="node-title" x="636" y="852" text-anchor="middle">新账户生效</text><text class="node-sub" x="636" y="868" text-anchor="middle">[申请状态=审核成功]；</text><text class="node-sub" x="636" y="880" text-anchor="middle">回写商家主记录当前结算账户；核对基线更新</text><rect class="end" x="77" y="1028" width="144" height="44" rx="22"/><text class="node-title end-text" x="149" y="1054" text-anchor="middle">流程结束</text></svg></main></body></html>
