html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">结算账户修改子流程</h1><p class="sub">平台确认商家改卡申请 → 微信审核（可打 0.01 元验证）→ 驳回重发 / 成功回写；每天限 5 次。</p><svg width="100%" viewBox="0 0 1098 1036" role="img" aria-labelledby="settlement-modify-title settlement-modify-desc"><title id="settlement-modify-title">结算账户修改子流程</title><desc id="settlement-modify-desc">商家主体级操作：平台侧确认商家改卡申请后调微信修改结算账户接口；微信受理生成修改申请单（审核中，期间可能打 0.01 元验证新卡）；审核驳回按原因重新发起（新申请单，每天限 5 次）；审核成功新账户生效并回写商家主记录当前结算账户。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 524 80 L 524 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 524 256 L 524 376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 524 432 L 524 552" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 226 608 L 168 608 L 168 752" stroke="#F53F3F" marker-end="url( >[申请状态=审核成功]；回写商家主记录当前结算账户；核对基线更新</text><rect class="end" x="121" y="928" width="144" height="44" rx="22"/><text class="node-title end-text" x="193" y="954" text-anchor="middle">流程结束</text></svg></main></body></html>
