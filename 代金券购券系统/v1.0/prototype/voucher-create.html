<!-- prototype-states: default, free, store-ready, submitted -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商家端 · 代金券发布页</title>
<link rel="stylesheet" href="mobile-components.css">
<link rel="stylesheet" href="mobile-icons.css">
<script src="mobile-components.js" defer></script>
<style>
html,body{margin:0;padding:0;overflow:hidden;height:100%}

.vc-commission{margin-top:10px;background:#fff7ec;border-radius:4px;padding:10px 12px;font-size:12px;color:#b25a00;line-height:1.7}
.vc-type-switch{display:flex;gap:6px;justify-content:flex-end}.vc-type-switch button{height:28px;padding:0 12px;border:1px solid #d5dce6;background:#fff;color:#86909c;border-radius:4px;font-size:12px}.vc-type-switch button.active{border-color:var(--m-primary);background:#eef5ff;color:var(--m-primary);font-weight:600}.vc-type-switch button:disabled{color:#b0b8c4;background:#f5f6f8;cursor:not-allowed}.vc-free .vc-paid-only{display:none}.vc-free-only{display:none}.vc-free .vc-free-only{display:block}.m-form-item.with-note{align-items:flex-start}.m-form-item.with-note .m-form-label{line-height:32px}.m-form-control-stack{display:flex;flex-direction:column;align-items:flex-end;gap:4px;width:100%}.m-form-control-stack .m-form-input{width:100%;height:32px;line-height:32px;text-align:right;box-sizing:border-box}.m-form-field-note{font-size:12px;line-height:1.5;color:#A6AFBD;text-align:right;width:100%}
</style>
</head>
<body>

<div class="yfl-c-root is-blue-nav m-phone">
<div class="m-phone-screen">

  <div class="m-status-bar">
    <span class="time">9:41</span>
    <div class="m-status-icons">
      <svg width="16" height="10" viewBox="0 0 16 10"><rect y="6" width="3" height="4" rx=".5" fill="currentColor"/><rect x="4" y="4" width="3" height="6" rx=".5" fill="currentColor"/><rect x="8" y="2" width="3" height="8" rx=".5" fill="currentColor"/><rect x="12" width="3" height="10" rx=".5" fill="currentColor"/></svg>
      <svg width="22" height="10" viewBox="0 0 22 10"><rect x=".5" y=".5" width="18" height="9" rx="2" fill="none" stroke="currentColor"/><rect x="2" y="2" width="15" height="6" rx="1" fill="currentColor"/><rect x="20" y="3" width="1.5" height="4" rx=".5" fill="currentColor"/></svg>
    </div>
  </div>

  <div class="m-nav-bar">
    <button class="back" aria-label="返回">‹</button>
    <span class="title">发布代金券</span>
    <div class="capsule"><div class="capsule-dots"><span></span><span></span><span></span></div><div class="capsule-divider"></div><div class="capsule-close"><span class="capsule-target"></span></div></div>
  </div>

  <div class="m-page-scroll">
  <main class="m-page-content">

    <section class="m-form-panel">
      <div class="m-form-title">基本信息</div>
      <label class="m-form-item"><span class="m-form-label"><i class="m-required">*</i>代金券名称</span><span class="m-form-control"><input class="m-form-input" placeholder="如：40元代50元代金券"></span></label>
      <div class="m-form-item"><span class="m-form-label">适用门店</span><span class="m-form-control m-form-placeholder">天天简餐（南医大店）<span class="m-form-arrow">›</span></span></div>
      <div class="m-form-item with-note"><span class="m-form-label">适用人群</span><span class="m-form-control"><span class="m-form-control-stack"><span class="vc-type-switch" id="audienceSwitch"><button type="button" class="active" data-aud="all">全部用户</button><button type="button" data-aud="new">仅新客</button></span><span class="m-form-field-note" id="audienceNote" data-style-ok style="display:none">未在本店核销过代金券的居民可见可购买</span></span></span></div>
    </section>

    <section class="m-form-panel">
      <div class="m-form-title" id="priceTitle">价格与库存</div>
      <div class="m-form-item"><span class="m-form-label"><i class="m-required">*</i>券类型</span><span class="m-form-control"><span class="vc-type-switch"><button type="button" class="active" data-vc-type="paid">付费券</button><button type="button" data-vc-type="free">免费券</button></span></span></div>
      <div class="m-form-item"><span class="m-form-label"><i class="m-required">*</i>券面额</span><span class="m-form-control"><input class="m-form-input" placeholder="买单可抵用金额，如 50" type="number"></span></div>
      <div class="m-form-item with-note"><span class="m-form-label"><i class="m-required">*</i>售价</span><span class="m-form-control"><span class="m-form-control-stack"><input class="m-form-input" id="priceInput" placeholder="居民购买价，如 40" type="number"><span class="m-form-field-note" id="priceNote">售价须低于面额</span></span></span></div>
            <label class="m-form-item"><span class="m-form-label"><i class="m-required">*</i>发售库存</span><span class="m-form-control"><input class="m-form-input" placeholder="发售总数量" type="number"></span></label>
      <label class="m-form-item"><span class="m-form-label">每人限领张数</span><span class="m-form-control"><input class="m-form-input" value="1" type="number" min="1"></span></label>
    </section>

    <section class="m-form-panel">
      <div class="m-form-title">有效期</div>
      <div class="m-form-item"><span class="m-form-label"><i class="m-required">*</i>可售开始时间</span><span class="m-form-control m-form-placeholder">立即开售<span class="m-form-arrow">›</span></span></div>
      <div class="m-form-item"><span class="m-form-label"><i class="m-required">*</i>可售结束时间</span><span class="m-form-control m-form-placeholder">如 2026-12-31<span class="m-form-arrow">›</span></span></div>
      <div class="m-form-item"><span class="m-form-label"><i class="m-required">*</i>使用有效期</span><span class="m-form-control m-form-placeholder">购买后 22 天内有效<span class="m-form-arrow">›</span></span></div>
    </section>

    <section class="m-form-panel">
      <div class="m-form-title">使用说明</div>
      <label class="m-form-item column"><span class="m-form-label">使用规则</span><textarea class="m-textarea" placeholder="如：满 80 元可用；每单限用 1 张；超出面额部分到店补收"></textarea><span class="m-textarea-count">0/300</span></label>
          </section>

    <div class="vc-commission">平台按实付金额收取抽佣（按平台当前比例，下单时计算），审核通过后上架。</div>

  </main>
  </div>

  <footer class="m-fixed-actions">
    <button class="m-action-secondary" data-m-action="toast" data-message="已存草稿">存草稿</button>
    <button class="m-action-primary" id="submitBtn" data-m-action="toast" data-message="已提交审核">提交审核</button>
  </footer>

</div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var st = params.get('state') || 'default';
  var root = document.querySelector('.m-phone-screen');
  var typeButtons = document.querySelectorAll('[data-vc-type]');
  function setType(type){
    root.classList.toggle('vc-free', type === 'free');
    typeButtons.forEach(function(button){ button.classList.toggle('active', button.dataset.vcType === type); });
    var priceInput = document.getElementById('priceInput');
    var priceNote = document.getElementById('priceNote');
    if (priceInput) {
      priceInput.disabled = (type === 'free');
      priceInput.value = (type === 'free') ? '0' : '';
      priceInput.placeholder = (type === 'free') ? '' : '居民购买价，如 40';
    }
    if (priceNote) priceNote.textContent = (type === 'free') ? '免费券售价固定为 ¥0，不可编辑' : '售价须低于面额';
    if (priceNote) priceNote.style.display = 'block';
  }
  typeButtons.forEach(function(button){ button.addEventListener('click', function(){ setType(button.dataset.vcType); }); });
  var audienceButtons = document.querySelectorAll('#audienceSwitch button');
  var audienceNote = document.getElementById('audienceNote');
  audienceButtons.forEach(function(button){
    button.addEventListener('click', function(){
      audienceButtons.forEach(function(b){ b.classList.toggle('active', b === button); });
      if (audienceNote) audienceNote.style.display = (button.dataset.aud === 'new') ? 'block' : 'none';
    });
  });
  if (st === 'free' || st === 'store-ready') setType('free');
  if (st === 'store-ready'){
    var paidType = document.querySelector('[data-vc-type="paid"]');
    paidType.disabled = true;
    paidType.textContent = '付费券（需完成进件）';
  }
  if (st === 'submitted'){
    var btn = document.getElementById('submitBtn');
    btn.className = 'm-action-secondary';
    btn.textContent = '待平台审核';
    btn.disabled = true;
  }
})();
</script>
</body>
</html>
