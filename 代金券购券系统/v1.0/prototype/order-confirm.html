<!-- prototype-states: default, paid, free -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居民端 · 订单确认页</title>
<link rel="stylesheet" href="mobile-components.css">
<link rel="stylesheet" href="mobile-icons.css">
<script src="mobile-components.js" defer></script>
<style>
html,body{margin:0;padding:0;overflow:hidden;height:100%}

.oc-card{margin-top:10px;background:#fff;padding:14px 16px}
.oc-title{font-size:14px;font-weight:700;margin-bottom:10px}
.oc-goods{display:flex;gap:12px}
.oc-goods-img{width:72px;height:72px;border-radius:6px;background:#eef3fb;color:#b7c4d4;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.oc-goods-name{font-size:14px;font-weight:600;line-height:1.4}
.oc-goods-meta{font-size:12px;color:#86909c;margin-top:4px}
.oc-goods-price{margin-top:6px;font-size:16px;font-weight:700;color:#e9305a}
.oc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px}
.oc-row .label{color:#86909c}
.oc-amount{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px dashed #eef0f4;font-size:14px}
.oc-amount .total{font-size:18px;font-weight:800;color:#e9305a}
.oc-tip{font-size:12px;color:#86909c;background:#f7f9fc;border-radius:4px;padding:8px 10px;margin-top:10px;line-height:1.7}.oc-free-note{display:none;color:#00a75c;font-size:13px;font-weight:700;margin-top:8px}.oc-free .oc-goods-price,.oc-free .oc-pay-row,.oc-free .oc-amount{display:none}.oc-free .oc-free-note{display:block}
</style>
</head>
<body>

<div class="yfl-c-root is-blue-nav m-phone">
<div class="m-phone-screen">

  <div class="m-status-bar">
    <span class="time">9:41</span>
    <div class="m-status-icons">
      <svg width="16" height="10" viewBox="0 0 16 10"><rect y="6" width="3" height="4" rx=".5" fill="currentColor"/><rect x="4" y="4" width="3" height="6" rx=".5" fill="currentColor"/><rect x="8" y="2" width="3" height="8" rx=".5" fill="currentColor"/><rect x="12" width="3" height="10" rx=".5" fill="currentColor"/></svg>
      <svg width="22" height="10" viewBox="0 0 22 10"><rect x=".5" y=".5" width="18" height="9" rx="2" fill="none" stroke="currentColor"/><rect x="2" y="2" width="15" height="6" rx="1" fill="currentColor"/><rect x="20" y="3" width="1.5" height="4" rx=".5" fill="currentColor"/></svg>
    </div>
  </div>

  <div class="m-nav-bar">
    <button class="back" aria-label="返回">‹</button>
    <span class="title">确认订单</span>
    <div class="capsule"><div class="capsule-dots"><span></span><span></span><span></span></div><div class="capsule-divider"></div><div class="capsule-close"><span class="capsule-target"></span></div></div>
  </div>

  <div class="m-page-scroll">
  <main class="m-page-content">

    <section class="oc-card">
      <div class="oc-title">代金券</div>
      <div class="oc-goods">
        <div class="oc-goods-img">¥</div>
        <div>
          <div class="oc-goods-name">天天简餐40元代50元代金券</div>
          <div class="oc-goods-meta">天天简餐 · 购买后 22 天内有效</div>
          <div class="oc-goods-price">¥40</div><div class="oc-free-note">免费领取 · 面额 ¥50</div>
        </div>
      </div>
    </section>

    <section class="oc-card">
      <div class="oc-title">购买说明</div>
      <div class="oc-row"><span class="label">使用人</span><span class="value">本账号微信实名用户</span></div>
      <div class="oc-row oc-pay-row" id="paymentRow"><span class="label">支付方式</span><span class="value">微信支付</span></div>
      <div class="oc-amount"><span>实付金额</span><span class="total">¥40</span></div>
      <div class="oc-tip" id="ocTip">未核销可申请退款，过期未使用自动原路退款。到店出示核销码即可使用。</div>
    </section>

  </main>
  </div>

  <footer class="m-fixed-actions">
    <button class="m-action-primary" id="payBtn" data-m-action="toast" data-message="拉起微信支付">确认支付 ¥40</button>
  </footer>

</div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var st = params.get('state') || 'default';
  var btn = document.getElementById('payBtn');
  if (st === 'free'){
    document.querySelector('.m-phone-screen').classList.add('oc-free');
    document.querySelector('.oc-goods-meta').textContent = '天天简餐 · 领取后 22 天内有效';
    document.getElementById('ocTip').textContent = '领取后生成 0 元订单，不进入支付和分账；到店出示核销码即可使用。';
    btn.textContent = '确认领取';
    btn.dataset.message = '已领取，进入订单详情';
  }
  if (st === 'paid'){
    btn.textContent = '支付完成，查看订单 ›';
    btn.setAttribute('data-m-action','toast');
    btn.setAttribute('data-message','进入支付结果页');
  }
})();
</script>
</body>
</html>
