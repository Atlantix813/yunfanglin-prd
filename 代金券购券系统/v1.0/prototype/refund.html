<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">退款流程（三分支）</h1><p class="sub">先按订单主单状态分流（未核销/已核销），再按触发方分流（用户/平台·系统）。</p><svg width="100%" viewBox="0 0 1815 2352" role="img" aria-labelledby="refund-title refund-desc"><title id="refund-title">退款流程（三分支）</title><desc id="refund-desc">订单主状态决定退款单走向：未核销（待使用）——用户申请免审核直接微信退款，平台/系统创建（过期任务等）走人工审核；已核销——退款仅平台·系统触发（居民只能联系客服），按分账状态分流：待分账走微信退款（成功后分账转已终止（退款）），已分账走平台垫付+追回。微信退款失败自动重试最多 3 次，仍失败转退款失败待人工。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 1148 80 L 1148 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 984 256 L 514 256 L 514 776" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1312 256 L 1462 256 L 1462 400" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 794 832 L 884 832 L 884 1200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 234 832 L 140 832 L 140 1000" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 140 1056 L 140 1098 L 550 1098 L 550 1176" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 714 1232 L 772 1232 L 772 1298 L 832 1298 L 832 1376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 884 1256 L 884 1298 L 882 1298 L 882 1376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1462 456 L 1462 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1284 632 L 1226 632 L 1226 800" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1062 1032 L 996 1032 L 996 1298 L 932 1298 L 932 1376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1390 1032 L 1456 1032 L 1456 1200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 882 1432 L 882 1510 L 669 1510 L 669 1588" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 980 1404 L 1038 1404 L 1038 1588" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1038 1644 L 1038 1836" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1038 1892 L 1038 2068" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1456 1256 L 1456 1408" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1456 1464 L 1456 1588" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1222 1644 L 1120 1644 L 1120 1758 L 1348 1758 L 1348 1844" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1690 1644 L 1740 1644 L 1740 1758 L 1668 1758 L 1668 1868" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1348 1900 L 1348 1990 L 1066 1990 L 1066 2068" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1668 1924 L 1668 2000 L 1095 2000 L 1095 2068" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 809 1616 L 907 1616 L 907 1990 L 1009 1990 L 1009 2068" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1052 2124 L 1052 2244" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1226 856 L 1226 976" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 386 1232 L 240 1232 L 240 2000 L 981 2000 L 981 2068" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1640 632 L 1750 632 L 1750 2010 L 1123 2010 L 1123 2068" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="721" y="236" width="56" height="12" rx="2"/><text class="edge-label" x="749" y="245" text-anchor="middle">否·未核销</text><rect class="label-mask" x="1325" y="236" width="124" height="12" rx="2"/><text class="edge-label" x="1387" y="245" text-anchor="middle">是·已核销（平台/系统触发）</text><rect class="label-mask" x="807" y="812" width="64" height="12" rx="2"/><text class="edge-label" x="839" y="821" text-anchor="middle">是·用户申请</text><rect class="label-mask" x="153" y="812" width="68" height="12" rx="2"/><text class="edge-label" x="187" y="821" text-anchor="middle">否·平台/系统</text><rect class="label-mask" x="727" y="1212" width="32" height="12" rx="2"/><text class="edge-label" x="743" y="1221" text-anchor="middle">通过</text><rect class="label-mask" x="1239" y="612" width="32" height="12" rx="2"/><text class="edge-label" x="1255" y="621" text-anchor="middle">通过</text><rect class="label-mask" x="1009" y="1012" width="40" height="12" rx="2"/><text class="edge-label" x="1029" y="1021" text-anchor="middle">待分账</text><rect class="label-mask" x="1403" y="1012" width="40" height="12" rx="2"/><text class="edge-label" x="1423" y="1021" text-anchor="middle">已分账</text><rect class="label-mask" x="890" y="1465" width="52" height="12" rx="2"/><text class="edge-label" x="916" y="1474" text-anchor="middle">3 次失败</text><rect class="label-mask" x="993" y="1384" width="32" height="12" rx="2"/><text class="edge-label" x="1009" y="1393" text-anchor="middle">成功</text><rect class="label-mask" x="1046" y="1734" width="88" height="12" rx="2"/><text class="edge-label" x="1090" y="1743" text-anchor="middle">待分账记录回写终止</text><rect class="label-mask" x="1046" y="1974" width="72" height="12" rx="2"/><text class="edge-label" x="1082" y="1983" text-anchor="middle">已终止（退款）</text><rect class="label-mask" x="1133" y="1624" width="76" height="12" rx="2"/><text class="edge-label" x="1171" y="1633" text-anchor="middle">否·部分/未追回</text><rect class="label-mask" x="1703" y="1624" width="24" height="12" rx="2"/><text class="edge-label" x="1715" y="1633" text-anchor="middle">是</text><rect class="label-mask" x="1356" y="1939" width="64" height="12" rx="2"/><text class="edge-label" x="1388" y="1948" text-anchor="middle">部分追回留痕</text><rect class="label-mask" x="1676" y="1956" width="40" height="12" rx="2"/><text class="edge-label" x="1696" y="1965" text-anchor="middle">已追回</text><rect class="label-mask" x="822" y="1596" width="72" height="12" rx="2"/><text class="edge-label" x="858" y="1605" text-anchor="middle">退款失败待人工</text><rect class="label-mask" x="253" y="1212" width="120" height="12" rx="2"/><text class="edge-label" x="313" y="1221" text-anchor="middle">驳回·恢复待使用与核销资格</text><rect class="label-mask" x="1655" y="612" width="80" height="12" rx="2"/><text class="edge-label" x="1695" y="621" text-anchor="middle">驳回·恢复已核销</text><rect class="start" x="1044" y="24" width="208" height="56" rx="28"/><text class="node-title" x="1148" y="48" text-anchor="middle">发起退款</text><text class="node-sub" x="1148" y="66" text-anchor="middle">居民申请 / 平台 PC 创建 / 过期系统任务</text><polygon class="decision" points="1148,200 1312,256 1148,312 984,256"/><text class="node-title" x="1148" y="251" text-anchor="middle">订单状态 == 已核销？</text><text class="node-sub decision-sub" x="1148" y="269" text-anchor="middle">按主单状态决定退款单走向</text><polygon class="decision" points="514,776 794,832 514,888 234,832"/><text class="node-title" x="514" y="827" text-anchor="middle">触发方 == 用户申请？</text><text class="node-sub decision-sub" x="514" y="845" text-anchor="middle">未核销分支：用户申请免审核；平台/系统创建走人工审核</text><rect class="step" x="32" y="1000" width="216" height="56" rx="6"/><text class="node-title" x="140" y="1024" text-anchor="middle">创建退款记录（未核销）</text><text class="node-sub" x="140" y="1042" text-anchor="middle">订单转[退款中]；核销码隐藏、核销接口拒绝</text><polygon class="decision" points="550,1176 714,1232 550,1288 386,1232"/><text class="node-title" x="550" y="1227" text-anchor="middle">退款审核是否通过？</text><text class="node-sub decision-sub" x="550" y="1245" text-anchor="middle">平台/系统创建的人工审核弹窗</text><rect class="step" x="782" y="1200" width="204" height="56" rx="6"/><text class="node-title" x="884" y="1224" text-anchor="middle">免审核直接退款</text><text class="node-sub" x="884" y="1242" text-anchor="middle">用户申请自动审核通过，直接进入微信退款</text><rect class="step" x="1308" y="400" width="308" height="56" rx="6"/><text class="node-title" x="1462" y="424" text-anchor="middle">创建退款记录（已核销）</text><text class="node-sub" x="1462" y="442" text-anchor="middle">居民不可直接退款（联系客服）；仅平台/系统触发；订单转[退款中]</text><rect class="step" x="1074" y="800" width="304" height="56" rx="6"/><text class="node-title" x="1226" y="824" text-anchor="middle">审核通过</text><text class="node-sub" x="1226" y="842" text-anchor="middle">分账状态仍待分账 / 未创建 → 微信退款通道；已分账 → 垫付通道</text><polygon class="decision" points="1226,976 1390,1032 1226,1088 1062,1032"/><text class="node-title" x="1226" y="1027" text-anchor="middle">分账状态 == 已分账？</text><text class="node-sub decision-sub" x="1226" y="1045" text-anchor="middle">审核通过时检查分账状态</text><polygon class="decision" points="1462,576 1640,632 1462,688 1284,632"/><text class="node-title" x="1462" y="627" text-anchor="middle">退款审核是否通过？</text><text class="node-sub decision-sub" x="1462" y="645" text-anchor="middle">已核销人工审核；驳回恢复已核销</text><rect class="step" x="784" y="1376" width="196" height="56" rx="6"/><text class="node-title" x="882" y="1400" text-anchor="middle">微信全额退款</text><text class="node-sub" x="882" y="1418" text-anchor="middle">金额=订单实付；失败自动重试最多 3 次</text><rect class="error" x="529" y="1588" width="280" height="56" rx="6"/><text class="node-title" x="669" y="1612" text-anchor="middle">3 次重试仍失败</text><text class="node-sub" x="669" y="1630" text-anchor="middle">售后=退款失败待人工；订单保持退款中；失败原因弹窗可重试</text><rect class="success" x="966" y="1588" width="144" height="56" rx="6"/><text class="node-title" x="1038" y="1612" text-anchor="middle">微信退款成功</text><text class="node-sub" x="1038" y="1630" text-anchor="middle">订单=已退款；售后=已退款</text><rect class="step" x="918" y="1836" width="240" height="56" rx="6"/><text class="node-title" x="1038" y="1860" text-anchor="middle">分账记录转「已终止（退款）」</text><text class="node-sub" x="1038" y="1878" text-anchor="middle">待分账记录由退款流程回写终止，每日任务不再执行</text><rect class="step" x="1304" y="1200" width="304" height="56" rx="6"/><text class="node-title" x="1456" y="1224" text-anchor="middle">平台垫付</text><text class="node-sub" x="1456" y="1242" text-anchor="middle">垫付弹窗审核通过即视为线下垫付完成；不调微信退款、不分账回退</text><rect class="step" x="1346" y="1408" width="220" height="56" rx="6"/><text class="node-title" x="1456" y="1432" text-anchor="middle">售后=已退款待追回</text><text class="node-sub" x="1456" y="1450" text-anchor="middle">订单=已退款；分账保持已分账；线下协商追回</text><polygon class="decision" points="1456,1588 1690,1644 1456,1700 1222,1644"/><text class="node-title" x="1456" y="1639" text-anchor="middle">追回金额 == 全额追回？</text><text class="node-sub decision-sub" x="1456" y="1657" text-anchor="middle">追回弹窗回填实际追回/未追回金额（纯留痕）</text><rect class="step" x="1222" y="1844" width="252" height="56" rx="6"/><text class="node-title" x="1348" y="1868" text-anchor="middle">记录未追回金额</text><text class="node-sub" x="1348" y="1886" text-anchor="middle">平台损失=微信手续费+商家未追回金额；线下继续协商</text><rect class="success" x="1596" y="1868" width="144" height="56" rx="6"/><text class="node-title" x="1668" y="1892" text-anchor="middle">售后=已追回</text><text class="node-sub" x="1668" y="1910" text-anchor="middle">追回完结</text><rect class="step" x="954" y="2068" width="196" height="56" rx="6"/><text class="node-title" x="1052" y="2092" text-anchor="middle">退款终态回写</text><text class="node-sub" x="1052" y="2110" text-anchor="middle">订单/售后/分账记录按分支最终状态更新</text><rect class="end" x="980" y="2244" width="144" height="44" rx="22"/><text class="node-title end-text" x="1052" y="2270" text-anchor="middle">流程结束</text></svg></main></body></html>
