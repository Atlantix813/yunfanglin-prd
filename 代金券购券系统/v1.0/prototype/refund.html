<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">退款流程（三分支）</h1><p class="sub">付费订单未核销退款 / 付费订单已核销未分账退款 / 付费订单已核销已分账退款——按分账状态分流。</p><svg width="100%" viewBox="0 0 1487 1896" role="img" aria-labelledby="refund-title refund-desc"><title id="refund-title">退款流程（三分支）</title><desc id="refund-desc">分支一（付费订单未核销退款）：居民申请自动审核通过（平台/系统创建走人工审核），微信全额退款，失败重试 3 次转人工。分支二（付费订单已核销未分账退款）：仅平台创建，审核时检查分账状态——仍待分账则微信退款（成功后分账转已终止（退款）），已被每日任务分账则自动转分支三。分支三（付费订单已核销已分账退款）：平台垫付弹窗，审核通过即视为垫付完成，不调微信退款、不分账回退；后续追回弹窗回填追回金额（纯留痕），平台损失=微信手续费+商家未追回金额。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 688 80 L 688 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 688 256 L 688 376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 922 432 L 1012 432 L 1012 626" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 454 432 L 360 432 L 360 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1012 682 L 1012 746 L 452 746 L 452 824" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 192 632 L 134 632 L 134 824" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 360 688 L 360 746 L 452 746 L 452 824" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 452 880 L 452 1000" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 288 1056 L 190 1056 L 190 1200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 616 1056 L 674 1056 L 674 1429.3333333333333" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 190 1256 L 190 1334 L 330 1334 L 330 1436" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 288 1228 L 624 1228 L 624 1429.3333333333333" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 649 1485.3333333333333 L 649 1534 L 441 1534 L 441 1612" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 441 1668 L 441 1788" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1067 1080 L 1067 1232" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1067 1288 L 1067 1412" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 833 1468 L 731 1468 L 731 1612" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1301 1468 L 1351 1468 L 1351 1612" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 731 1668 L 731 1710 L 471 1710 L 471 1788" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1351 1668 L 1351 1720 L 500 1720 L 500 1788" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 330 1492 L 330 1710 L 412 1710 L 412 1788" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="935" y="412" width="64" height="12" rx="2"/><text class="edge-label" x="967" y="421" text-anchor="middle">否·用户申请</text><rect class="label-mask" x="373" y="412" width="68" height="12" rx="2"/><text class="edge-label" x="407" y="421" text-anchor="middle">是·平台/系统</text><rect class="label-mask" x="147" y="612" width="32" height="12" rx="2"/><text class="edge-label" x="163" y="621" text-anchor="middle">驳回</text><rect class="label-mask" x="368" y="711" width="32" height="12" rx="2"/><text class="edge-label" x="384" y="720" text-anchor="middle">通过</text><rect class="label-mask" x="203" y="1036" width="72" height="12" rx="2"/><text class="edge-label" x="239" y="1045" text-anchor="middle">未分账/未创建</text><rect class="label-mask" x="629" y="1036" width="32" height="12" rx="2"/><text class="edge-label" x="645" y="1045" text-anchor="middle">成功</text><rect class="label-mask" x="198" y="1289" width="52" height="12" rx="2"/><text class="edge-label" x="224" y="1298" text-anchor="middle">3 次失败</text><rect class="label-mask" x="440" y="1208" width="32" height="12" rx="2"/><text class="edge-label" x="456" y="1217" text-anchor="middle">成功</text><rect class="label-mask" x="744" y="1448" width="76" height="12" rx="2"/><text class="edge-label" x="782" y="1457" text-anchor="middle">否·部分/未追回</text><rect class="label-mask" x="1314" y="1448" width="24" height="12" rx="2"/><text class="edge-label" x="1326" y="1457" text-anchor="middle">是</text><rect class="start" x="544" y="24" width="288" height="56" rx="28"/><text class="node-title" x="688" y="48" text-anchor="middle">发起退款</text><text class="node-sub" x="688" y="66" text-anchor="middle">居民申请（未核销）/ 平台 PC 创建（已核销）/ 过期系统任务</text><rect class="step" x="580" y="200" width="216" height="56" rx="6"/><text class="node-title" x="688" y="224" text-anchor="middle">创建退款记录</text><text class="node-sub" x="688" y="242" text-anchor="middle">订单转[退款中]；核销码隐藏、核销接口拒绝</text><polygon class="decision" points="688,376 922,432 688,488 454,432"/><text class="node-title" x="688" y="427" text-anchor="middle">售后状态 == 待审核？</text><text class="node-sub decision-sub" x="688" y="445" text-anchor="middle">用户申请自动通过；平台/系统创建走人工审核</text><rect class="step" x="914" y="626" width="196" height="56" rx="6"/><text class="node-title" x="1012" y="650" text-anchor="middle">系统自动审核通过</text><text class="node-sub" x="1012" y="668" text-anchor="middle">用户申请的未核销退款直接进入微信退款</text><polygon class="decision" points="360,576 528,632 360,688 192,632"/><text class="node-title" x="360" y="627" text-anchor="middle">退款审核是否通过？</text><text class="node-sub decision-sub" x="360" y="645" text-anchor="middle">审核弹窗：审核备注+通过/驳回</text><rect class="error" x="32" y="824" width="204" height="56" rx="6"/><text class="node-title" x="134" y="848" text-anchor="middle">审核驳回</text><text class="node-sub" x="134" y="866" text-anchor="middle">订单恢复[退款前订单状态]；恢复核销资格</text><rect class="step" x="300" y="824" width="304" height="56" rx="6"/><text class="node-title" x="452" y="848" text-anchor="middle">审核通过</text><text class="node-sub" x="452" y="866" text-anchor="middle">分账状态仍待分账 / 未创建 → 微信退款通道；已分账 → 垫付通道</text><polygon class="decision" points="452,1000 616,1056 452,1112 288,1056"/><text class="node-title" x="452" y="1051" text-anchor="middle">分账状态 == 已分账？</text><text class="node-sub decision-sub" x="452" y="1069" text-anchor="middle">审核通过时检查</text><rect class="step" x="92" y="1200" width="196" height="56" rx="6"/><text class="node-title" x="190" y="1224" text-anchor="middle">微信全额退款</text><text class="node-sub" x="190" y="1242" text-anchor="middle">金额=订单实付；失败自动重试最多 3 次</text><rect class="error" x="180" y="1436" width="300" height="56" rx="6"/><text class="node-title" x="330" y="1460" text-anchor="middle">3 次重试仍失败</text><text class="node-sub" x="330" y="1478" text-anchor="middle">售后=退款失败待人工；订单保持退款中；PC 可重新重试/人工处理</text><rect class="success" x="577" y="1429.3333333333333" width="144" height="56" rx="6"/><text class="node-title" x="649" y="1453.3333333333333" text-anchor="middle">微信退款成功</text><text class="node-sub" x="649" y="1471.3333333333333" text-anchor="middle">订单=已退款；售后=已退款</text><rect class="step" x="341" y="1612" width="200" height="56" rx="6"/><text class="node-title" x="441" y="1636" text-anchor="middle">分账记录转「已终止（退款）」</text><text class="node-sub" x="441" y="1654" text-anchor="middle">仅分支二：未分账记录终止</text><rect class="step" x="897" y="1024" width="340" height="56" rx="6"/><text class="node-title" x="1067" y="1048" text-anchor="middle">平台垫付</text><text class="node-sub" x="1067" y="1066" text-anchor="middle">分支三：垫付弹窗审核通过即视为线下垫付完成；不调微信退款、不分账回退</text><rect class="step" x="957" y="1232" width="220" height="56" rx="6"/><text class="node-title" x="1067" y="1256" text-anchor="middle">售后=已退款待追回</text><text class="node-sub" x="1067" y="1274" text-anchor="middle">订单=已退款；分账保持已分账；线下协商追回</text><polygon class="decision" points="1067,1412 1301,1468 1067,1524 833,1468"/><text class="node-title" x="1067" y="1463" text-anchor="middle">追回金额 == 全额追回？</text><text class="node-sub decision-sub" x="1067" y="1481" text-anchor="middle">追回弹窗回填实际追回/未追回金额（纯留痕）</text><rect class="step" x="605" y="1612" width="252" height="56" rx="6"/><text class="node-title" x="731" y="1636" text-anchor="middle">记录未追回金额</text><text class="node-sub" x="731" y="1654" text-anchor="middle">平台损失=微信手续费+商家未追回金额；线下继续协商</text><rect class="success" x="1279" y="1612" width="144" height="56" rx="6"/><text class="node-title" x="1351" y="1636" text-anchor="middle">售后=已追回</text><text class="node-sub" x="1351" y="1654" text-anchor="middle">追回完结</text><rect class="end" x="384" y="1788" width="144" height="44" rx="22"/><text class="node-title end-text" x="456" y="1814" text-anchor="middle">流程结束</text></svg></main></body></html>
