html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">退款流程（三分支）</h1><p class="sub">先按订单主单状态分流（未核销/已核销），再按触发方分流（用户/平台·系统）。</p><svg width="100%" viewBox="0 0 1467 2516" role="img" aria-labelledby="refund-title refund-desc"><title id="refund-title">退款流程（三分支）</title><desc id="refund-desc">订单主状态决定退款单走向：未核销（待使用）——用户申请免审核直接微信退款，平台/系统创建（过期任务等）走人工审核；已核销——退款仅平台·系统触发（居民只能联系客服），按分账状态分流：待分账走微信退款（成功后分账转已终止（退款）），已分账走平台垫付+追回。微信退款失败自动重试最多 3 次，仍失败转退款失败待人工。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 834 80 L 834 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 670 270 L 588 270 L 588 616" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 998 270 L 1148 270 L 1148 428" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 756 698 L 846 698 L 846 790 L 598 790 L 598 1096" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 420 698 L 326 698 L 326 896" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 326 976 L 326 1136" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 178 1394 L 32 1394 L 32 2164 L 873 2164 L 873 2232" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 474 1394 L 688 1394 L 688 1474 L 698 1474 L 698 1552" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 468 1130 L 426 1130 L 426 1246 L 698 1246 L 698 1552" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1148 496 L 1148 668" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1296 938 L 1402 938 L 1402 2164 L 1007 2164 L 1007 2232" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1000 938 L 942 938 L 942 1018 L 968 1018 L 968 1096" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 804 1166 L 738 1166 L 738 1246 L 698 1246 L 698 1552" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1132 1166 L 1198 1166 L 1198 1352" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 698 1632 L 698 1976" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 770 1592 L 940 1592 L 940 1788" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 940 1856 L 940 1988" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 940 2056 L 940 2232" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1198 1432 L 1198 1584" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1198 1664 L 1198 1788" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1198 1856 L 1198 2030" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1198 2086 L 1198 2154 L 973 2154 L 973 2232" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 698 2056 L 698 2154 L 907 2154 L 907 2232" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 940 2288 L 940 2408" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 326 1192 L 326 1324" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1148 724 L 1148 868" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="601" y="250" width="56" height="12" rx="2"/><text class="edge-label" x="629" y="259" text-anchor="middle">否·未核销</text><rect class="label-mask" x="1011" y="250" width="124" height="12" rx="2"/><text class="edge-label" x="1073" y="259" text-anchor="middle">是·已核销（平台/系统触发）</text><rect class="label-mask" x="769" y="678" width="64" height="12" rx="2"/><text class="edge-label" x="801" y="687" text-anchor="middle">是·用户申请</text><rect class="label-mask" x="339" y="678" width="68" height="12" rx="2"/><text class="edge-label" x="373" y="687" text-anchor="middle">否·平台/系统</text><rect class="label-mask" x="45" y="1374" width="120" height="12" rx="2"/><text class="edge-label" x="105" y="1383" text-anchor="middle">驳回·恢复待使用与核销资格</text><rect class="label-mask" x="565" y="1374" width="32" height="12" rx="2"/><text class="edge-label" x="581" y="1383" text-anchor="middle">通过</text><rect class="label-mask" x="1309" y="918" width="80" height="12" rx="2"/><text class="edge-label" x="1349" y="927" text-anchor="middle">驳回·恢复已核销</text><rect class="label-mask" x="955" y="918" width="32" height="12" rx="2"/><text class="edge-label" x="971" y="927" text-anchor="middle">通过</text><rect class="label-mask" x="751" y="1146" width="40" height="12" rx="2"/><text class="edge-label" x="771" y="1155" text-anchor="middle">待分账</text><rect class="label-mask" x="1145" y="1146" width="40" height="12" rx="2"/><text class="edge-label" x="1165" y="1155" text-anchor="middle">已分账</text><rect class="label-mask" x="706" y="1798" width="52" height="12" rx="2"/><text class="edge-label" x="732" y="1807" text-anchor="middle">3 次失败</text><rect class="label-mask" x="839" y="1572" width="32" height="12" rx="2"/><text class="edge-label" x="855" y="1581" text-anchor="middle">成功</text><rect class="label-mask" x="948" y="2138" width="72" height="12" rx="2"/><text class="edge-label" x="984" y="2147" text-anchor="middle">已终止（退款）</text><rect class="label-mask" x="1206" y="2114" width="40" height="12" rx="2"/><text class="edge-label" x="1226" y="2123" text-anchor="middle">已追回</text><rect class="label-mask" x="706" y="2099" width="72" height="12" rx="2"/><text class="edge-label" x="742" y="2108" text-anchor="middle">退款失败待人工</text><rect class="start" x="730" y="24" width="208" height="56" rx="28"/><text class="node-title" x="834" y="48" text-anchor="middle">发起退款</text><text class="node-sub" x="834" y="64" text-anchor="middle">居民申请 / 平台 PC 创建 / 过期系统任务</text><polygon class="decision" points="834,200 998,270 834,340 670,270"/><text class="node-title" x="834" y="265" text-anchor="middle">订单状态 == 已核销？</text><text class="node-sub decision-sub" x="834" y="280" text-anchor="middle">按主单状态决定退款单走向</text><polygon class="decision" points="588,616 756,698 588,780 420,698"/><text class="node-title" x="588" y="693" text-anchor="middle">触发方 == 用户申请？</text><text class="node-sub decision-sub" x="588" y="708" text-anchor="middle">未核销分支：用户申请免审核；</text><text class="node-sub decision-sub" x="588" y="721" text-anchor="middle">平台/系统创建走人工审核</text><rect class="step" x="238" y="896" width="176" height="80" rx="6"/><text class="node-title" x="326" y="920" text-anchor="middle">创建退款记录（人工审核）</text><text class="node-sub" x="326" y="936" text-anchor="middle">订单转[退款中]；核销码隐藏、核销接口拒绝；</text><text class="node-sub" x="326" y="948" text-anchor="middle">创建后走人工审核</text><rect class="step" x="236" y="1136" width="180" height="56" rx="6"/><text class="node-title" x="326" y="1160" text-anchor="middle">平台人工审核</text><text class="node-sub" x="326" y="1176" text-anchor="middle">审核弹窗动作；触发[售后状态]变更</text><polygon class="decision" points="326,1324 474,1394 326,1464 178,1394"/><text class="node-title" x="326" y="1389" text-anchor="middle">退款审核是否通过？</text><text class="node-sub decision-sub" x="326" y="1404" text-anchor="middle">人工审核动作完成后判定</text><rect class="step" x="468" y="1096" width="260" height="68" rx="6"/><text class="node-title" x="598" y="1120" text-anchor="middle">创建退款记录（免审核）</text><text class="node-sub" x="598" y="1136" text-anchor="middle">用户申请自动审核通过，记录创建后直接进入微信退款；</text><text class="node-sub" x="598" y="1148" text-anchor="middle">订单转[退款中]、核销码隐藏</text><rect class="step" x="1060" y="428" width="176" height="68" rx="6"/><text class="node-title" x="1148" y="452" text-anchor="middle">创建退款记录（已核销）</text><text class="node-sub" x="1148" y="468" text-anchor="middle">居民不可直接退款（联系客服）；</text><text class="node-sub" x="1148" y="480" text-anchor="middle">仅平台/系统触发；订单转[退款中]</text><rect class="step" x="1058" y="668" width="180" height="56" rx="6"/><text class="node-title" x="1148" y="692" text-anchor="middle">平台人工审核</text><text class="node-sub" x="1148" y="708" text-anchor="middle">审核弹窗动作；触发[售后状态]变更</text><polygon class="decision" points="1148,868 1296,938 1148,1008 1000,938"/><text class="node-title" x="1148" y="933" text-anchor="middle">退款审核是否通过？</text><text class="node-sub decision-sub" x="1148" y="948" text-anchor="middle">人工审核动作完成后判定</text><rect class="step" x="626" y="1552" width="144" height="80" rx="6"/><text class="node-title" x="698" y="1576" text-anchor="middle">微信全额退款</text><text class="node-sub" x="698" y="1592" text-anchor="middle">[售后状态=微信退款中]；金额=订单实付；</text><text class="node-sub" x="698" y="1604" text-anchor="middle">失败自动重试最多 3 次</text><rect class="error" x="620" y="1976" width="156" height="80" rx="6"/><text class="node-title" x="698" y="2000" text-anchor="middle">3 次重试仍失败</text><text class="node-sub" x="698" y="2016" text-anchor="middle">[售后状态=退款失败待人工]；</text><text class="node-sub" x="698" y="2028" text-anchor="middle">订单保持[退款中]；失败原因弹窗可重试</text><rect class="success" x="868" y="1788" width="144" height="68" rx="6"/><text class="node-title" x="940" y="1812" text-anchor="middle">微信退款成功</text><text class="node-sub" x="940" y="1828" text-anchor="middle">[订单状态=已退款]；[售后状态=已退款]</text><rect class="step" x="840" y="1988" width="200" height="68" rx="6"/><text class="node-title" x="940" y="2012" text-anchor="middle">分账记录转「已终止（退款）」</text><text class="node-sub" x="940" y="2028" text-anchor="middle">[分账状态=已终止（退款）]；</text><text class="node-sub" x="940" y="2040" text-anchor="middle">由退款流程回写，每日任务不再执行</text><rect class="step" x="1124" y="1352" width="148" height="80" rx="6"/><text class="node-title" x="1198" y="1376" text-anchor="middle">平台垫付</text><text class="node-sub" x="1198" y="1392" text-anchor="middle">[订单状态=已退款]；</text><text class="node-sub" x="1198" y="1404" text-anchor="middle">[售后状态=已退款待追回]；</text><text class="node-sub" x="1198" y="1416" text-anchor="middle">不调微信退款、不分账回退</text><rect class="step" x="1124" y="1584" width="148" height="80" rx="6"/><text class="node-title" x="1198" y="1608" text-anchor="middle">售后=已退款待追回</text><text class="node-sub" x="1198" y="1624" text-anchor="middle">[订单状态=已退款]；</text><text class="node-sub" x="1198" y="1636" text-anchor="middle">[售后状态=已退款待追回]；分账保持已分账</text><rect class="step" x="1086" y="1788" width="224" height="68" rx="6"/><text class="node-title" x="1198" y="1812" text-anchor="middle">记录追回（一次性）</text><text class="node-sub" x="1198" y="1828" text-anchor="middle">[售后状态=已追回]；</text><text class="node-sub" x="1198" y="1840" text-anchor="middle">一次性回填：实际追回金额/追回时间/追回备注</text><rect class="success" x="1104" y="2030" width="188" height="56" rx="6"/><text class="node-title" x="1198" y="2054" text-anchor="middle">售后=已追回</text><text class="node-sub" x="1198" y="2070" text-anchor="middle">平台损失=微信手续费+商家未追回金额</text><rect class="step" x="842" y="2232" width="196" height="56" rx="6"/><text class="node-title" x="940" y="2256" text-anchor="middle">退款终态回写</text><text class="node-sub" x="940" y="2272" text-anchor="middle">订单/售后/分账记录按分支最终状态更新</text><rect class="end" x="868" y="2408" width="144" height="44" rx="22"/><text class="node-title end-text" x="940" y="2434" text-anchor="middle">流程结束</text><polygon class="decision" points="968,1096 1132,1166 968,1236 804,1166"/><text class="node-title" x="968" y="1161" text-anchor="middle">分账状态 == 已分账？</text><text class="node-sub decision-sub" x="968" y="1176" text-anchor="middle">审核通过时检查分账状态</text></svg></main></body></html>
