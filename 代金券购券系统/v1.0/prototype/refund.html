html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">退款流程（三分支）</h1><p class="sub">先按订单主单状态分流（未核销/已核销），再按触发方分流（用户/平台·系统）。</p><svg width="100%" viewBox="0 0 1863 2080" role="img" aria-labelledby="refund-title refund-desc"><title id="refund-title">退款流程（三分支）</title><desc id="refund-desc">订单主状态决定退款单走向：未核销（待使用）——用户申请免审核直接微信退款，平台/系统创建（过期任务等）走人工审核；已核销——退款仅平台·系统触发（居民只能联系客服），按分账状态分流：待分账走微信退款（成功后分账转已终止（退款）），已分账走平台垫付+追回。微信退款失败自动重试最多 3 次，仍失败转退款失败待人工。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 1200 80 L 1200 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1036 256 L 554 256 L 554 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1364 256 L 1514 256 L 1514 400" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 834 632 L 924 632 L 924 1000" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 274 632 L 180 632 L 180 800" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 180 856 L 180 898 L 504 898 L 504 976" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 340 1032 L 194 1032 L 194 1728 L 1181 1728 L 1181 1796" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 668 1032 L 726 1032 L 726 1098 L 924 1098 L 924 1176" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 924 1056 L 924 1176" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1514 456 L 1514 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1692 632 L 1798 632 L 1798 1728 L 1315 1728 L 1315 1796" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1336 632 L 1278 632 L 1278 698 L 1352 698 L 1352 776" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1188 832 L 1122 832 L 1122 1098 L 924 1098 L 924 1176" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1516 832 L 1586 832 L 1586 1000" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 924 1232 L 924 1564" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 1022 1204 L 1248 1204 L 1248 1388" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1248 1444 L 1248 1564" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1248 1620 L 1248 1796" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1586 1056 L 1586 1208" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1586 1264 L 1586 1388" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1586 1444 L 1586 1596" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1586 1652 L 1586 1718 L 1281 1718 L 1281 1796" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 924 1620 L 924 1718 L 1215 1718 L 1215 1796" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1248 1852 L 1248 1972" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="767" y="236" width="56" height="12" rx="2"/><text class="edge-label" x="795" y="245" text-anchor="middle">否·未核销</text><rect class="label-mask" x="1377" y="236" width="124" height="12" rx="2"/><text class="edge-label" x="1439" y="245" text-anchor="middle">是·已核销（平台/系统触发）</text><rect class="label-mask" x="847" y="612" width="64" height="12" rx="2"/><text class="edge-label" x="879" y="621" text-anchor="middle">是·用户申请</text><rect class="label-mask" x="193" y="612" width="68" height="12" rx="2"/><text class="edge-label" x="227" y="621" text-anchor="middle">否·平台/系统</text><rect class="label-mask" x="207" y="1012" width="120" height="12" rx="2"/><text class="edge-label" x="267" y="1021" text-anchor="middle">驳回·恢复待使用与核销资格</text><rect class="label-mask" x="681" y="1012" width="32" height="12" rx="2"/><text class="edge-label" x="697" y="1021" text-anchor="middle">通过</text><rect class="label-mask" x="1705" y="612" width="80" height="12" rx="2"/><text class="edge-label" x="1745" y="621" text-anchor="middle">驳回·恢复已核销</text><rect class="label-mask" x="1291" y="612" width="32" height="12" rx="2"/><text class="edge-label" x="1307" y="621" text-anchor="middle">通过</text><rect class="label-mask" x="1135" y="812" width="40" height="12" rx="2"/><text class="edge-label" x="1155" y="821" text-anchor="middle">待分账</text><rect class="label-mask" x="1531" y="812" width="40" height="12" rx="2"/><text class="edge-label" x="1551" y="821" text-anchor="middle">已分账</text><rect class="label-mask" x="932" y="1392" width="52" height="12" rx="2"/><text class="edge-label" x="958" y="1401" text-anchor="middle">3 次失败</text><rect class="label-mask" x="1119" y="1184" width="32" height="12" rx="2"/><text class="edge-label" x="1135" y="1193" text-anchor="middle">成功</text><rect class="label-mask" x="1256" y="1702" width="72" height="12" rx="2"/><text class="edge-label" x="1292" y="1711" text-anchor="middle">已终止（退款）</text><rect class="label-mask" x="1594" y="1679" width="40" height="12" rx="2"/><text class="edge-label" x="1614" y="1688" text-anchor="middle">已追回</text><rect class="label-mask" x="932" y="1663" width="72" height="12" rx="2"/><text class="edge-label" x="968" y="1672" text-anchor="middle">退款失败待人工</text><rect class="start" x="1096" y="24" width="208" height="56" rx="28"/><text class="node-title" x="1200" y="48" text-anchor="middle">发起退款</text><text class="node-sub" x="1200" y="66" text-anchor="middle">居民申请 / 平台 PC 创建 / 过期系统任务</text><polygon class="decision" points="1200,200 1364,256 1200,312 1036,256"/><text class="node-title" x="1200" y="251" text-anchor="middle">订单状态 == 已核销？</text><text class="node-sub decision-sub" x="1200" y="269" text-anchor="middle">按主单状态决定退款单走向</text><polygon class="decision" points="554,576 834,632 554,688 274,632"/><text class="node-title" x="554" y="627" text-anchor="middle">触发方 == 用户申请？</text><text class="node-sub decision-sub" x="554" y="645" text-anchor="middle">未核销分支：用户申请免审核；平台/系统创建走人工审核</text><rect class="step" x="32" y="800" width="296" height="56" rx="6"/><text class="node-title" x="180" y="824" text-anchor="middle">创建退款记录（人工审核）</text><text class="node-sub" x="180" y="842" text-anchor="middle">订单转[退款中]；核销码隐藏、核销接口拒绝；创建后走人工审核</text><polygon class="decision" points="504,976 668,1032 504,1088 340,1032"/><text class="node-title" x="504" y="1027" text-anchor="middle">退款审核是否通过？</text><text class="node-sub decision-sub" x="504" y="1045" text-anchor="middle">平台/系统创建的人工审核弹窗</text><rect class="step" x="736" y="1000" width="376" height="56" rx="6"/><text class="node-title" x="924" y="1024" text-anchor="middle">创建退款记录（免审核）</text><text class="node-sub" x="924" y="1042" text-anchor="middle">用户申请自动审核通过，记录创建后直接进入微信退款；订单转[退款中]、核销码隐藏</text><rect class="step" x="1360" y="400" width="308" height="56" rx="6"/><text class="node-title" x="1514" y="424" text-anchor="middle">创建退款记录（已核销）</text><text class="node-sub" x="1514" y="442" text-anchor="middle">居民不可直接退款（联系客服）；仅平台/系统触发；订单转[退款中]</text><polygon class="decision" points="1514,576 1692,632 1514,688 1336,632"/><text class="node-title" x="1514" y="627" text-anchor="middle">退款审核是否通过？</text><text class="node-sub decision-sub" x="1514" y="645" text-anchor="middle">已核销人工审核；驳回恢复已核销</text><rect class="step" x="826" y="1176" width="196" height="56" rx="6"/><text class="node-title" x="924" y="1200" text-anchor="middle">微信全额退款</text><text class="node-sub" x="924" y="1218" text-anchor="middle">金额=订单实付；失败自动重试最多 3 次</text><rect class="error" x="784" y="1564" width="280" height="56" rx="6"/><text class="node-title" x="924" y="1588" text-anchor="middle">3 次重试仍失败</text><text class="node-sub" x="924" y="1606" text-anchor="middle">售后=退款失败待人工；订单保持退款中；失败原因弹窗可重试</text><rect class="success" x="1176" y="1388" width="144" height="56" rx="6"/><text class="node-title" x="1248" y="1412" text-anchor="middle">微信退款成功</text><text class="node-sub" x="1248" y="1430" text-anchor="middle">订单=已退款；售后=已退款</text><rect class="step" x="1128" y="1564" width="240" height="56" rx="6"/><text class="node-title" x="1248" y="1588" text-anchor="middle">分账记录转「已终止（退款）」</text><text class="node-sub" x="1248" y="1606" text-anchor="middle">待分账记录由退款流程回写终止，每日任务不再执行</text><rect class="step" x="1434" y="1000" width="304" height="56" rx="6"/><text class="node-title" x="1586" y="1024" text-anchor="middle">平台垫付</text><text class="node-sub" x="1586" y="1042" text-anchor="middle">垫付弹窗审核通过即视为线下垫付完成；不调微信退款、不分账回退</text><rect class="step" x="1508" y="1208" width="156" height="56" rx="6"/><text class="node-title" x="1586" y="1232" text-anchor="middle">售后=已退款待追回</text><text class="node-sub" x="1586" y="1250" text-anchor="middle">订单=已退款；分账保持已分账</text><rect class="step" x="1384" y="1388" width="404" height="56" rx="6"/><text class="node-title" x="1586" y="1412" text-anchor="middle">记录追回（一次性）</text><text class="node-sub" x="1586" y="1430" text-anchor="middle">与商家线下协商后，追回弹窗回填：实际追回金额/追回时间/追回备注；保存后售后转已追回</text><rect class="success" x="1492" y="1596" width="188" height="56" rx="6"/><text class="node-title" x="1586" y="1620" text-anchor="middle">售后=已追回</text><text class="node-sub" x="1586" y="1638" text-anchor="middle">平台损失=微信手续费+商家未追回金额</text><rect class="step" x="1150" y="1796" width="196" height="56" rx="6"/><text class="node-title" x="1248" y="1820" text-anchor="middle">退款终态回写</text><text class="node-sub" x="1248" y="1838" text-anchor="middle">订单/售后/分账记录按分支最终状态更新</text><rect class="end" x="1176" y="1972" width="144" height="44" rx="22"/><text class="node-title end-text" x="1248" y="1998" text-anchor="middle">流程结束</text><polygon class="decision" points="1352,776 1516,832 1352,888 1188,832"/><text class="node-title" x="1352" y="827" text-anchor="middle">分账状态 == 已分账？</text><text class="node-sub decision-sub" x="1352" y="845" text-anchor="middle">审核通过时检查分账状态</text></svg></main></body></html>
