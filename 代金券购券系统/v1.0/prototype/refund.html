<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">退款流程（三分支）</h1><p class="sub">先按订单主单状态分流（未核销/已核销），再按触发方分流（用户/平台·系统）。</p><svg width="100%" viewBox="0 0 1606 2280" role="img" aria-labelledby="refund-title refund-desc"><title id="refund-title">退款流程（三分支）</title><desc id="refund-desc">订单主状态决定退款单走向：未核销（待使用）——用户申请免审核直接微信退款，平台/系统创建（过期任务等）走人工审核；已核销——退款仅平台·系统触发（居民只能联系客服），按分账状态分流：待分账走微信退款（成功后分账转已终止（退款）），已分账走平台垫付+追回。微信退款失败自动重试最多 3 次，仍失败转退款失败待人工。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 973 80 L 973 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 809 256 L 700 256 L 700 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1137 256 L 1287 256 L 1287 400" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 980 632 L 1070 632 L 1070 698 L 656 698 L 656 976" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 420 632 L 326 632 L 326 800" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 326 856 L 326 1000" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 178 1232 L 32 1232 L 32 1928 L 927 1928 L 927 1996" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 474 1232 L 610 1232 L 610 1298 L 620 1298 L 620 1376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 468 1004 L 426 1004 L 426 1098 L 620 1098 L 620 1376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1287 456 L 1287 600" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1435 832 L 1541 832 L 1541 1928 L 1061 1928 L 1061 1996" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1139 832 L 1081 832 L 1081 898 L 1084 898 L 1084 976" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 920 1032 L 854 1032 L 854 1098 L 620 1098 L 620 1376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1248 1032 L 1314 1032 L 1314 1200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 620 1432 L 620 1764" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 772 1404 L 994 1404 L 994 1588" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 994 1644 L 994 1764" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 994 1820 L 994 1996" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1314 1256 L 1314 1408" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1314 1464 L 1314 1588" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1314 1644 L 1314 1796" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1314 1852 L 1314 1918 L 1027 1918 L 1027 1996" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 620 1820 L 620 1918 L 961 1918 L 961 1996" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 994 2052 L 994 2172" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 326 1056 L 326 1176" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1287 656 L 1287 776" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="726.5" y="236" width="56" height="12" rx="2"/><text class="edge-label" x="754.5" y="245" text-anchor="middle">否·未核销</text><rect class="label-mask" x="1150" y="236" width="124" height="12" rx="2"/><text class="edge-label" x="1212" y="245" text-anchor="middle">是·已核销（平台/系统触发）</text><rect class="label-mask" x="993" y="612" width="64" height="12" rx="2"/><text class="edge-label" x="1025" y="621" text-anchor="middle">是·用户申请</text><rect class="label-mask" x="339" y="612" width="68" height="12" rx="2"/><text class="edge-label" x="373" y="621" text-anchor="middle">否·平台/系统</text><rect class="label-mask" x="45" y="1212" width="120" height="12" rx="2"/><text class="edge-label" x="105" y="1221" text-anchor="middle">驳回·恢复待使用与核销资格</text><rect class="label-mask" x="526" y="1212" width="32" height="12" rx="2"/><text class="edge-label" x="542" y="1221" text-anchor="middle">通过</text><rect class="label-mask" x="1448" y="812" width="80" height="12" rx="2"/><text class="edge-label" x="1488" y="821" text-anchor="middle">驳回·恢复已核销</text><rect class="label-mask" x="1094" y="812" width="32" height="12" rx="2"/><text class="edge-label" x="1110" y="821" text-anchor="middle">通过</text><rect class="label-mask" x="867" y="1012" width="40" height="12" rx="2"/><text class="edge-label" x="887" y="1021" text-anchor="middle">待分账</text><rect class="label-mask" x="1261" y="1012" width="40" height="12" rx="2"/><text class="edge-label" x="1281" y="1021" text-anchor="middle">已分账</text><rect class="label-mask" x="628" y="1592" width="52" height="12" rx="2"/><text class="edge-label" x="654" y="1601" text-anchor="middle">3 次失败</text><rect class="label-mask" x="867" y="1384" width="32" height="12" rx="2"/><text class="edge-label" x="883" y="1393" text-anchor="middle">成功</text><rect class="label-mask" x="1002" y="1902" width="72" height="12" rx="2"/><text class="edge-label" x="1038" y="1911" text-anchor="middle">已终止（退款）</text><rect class="label-mask" x="1322" y="1879" width="40" height="12" rx="2"/><text class="edge-label" x="1342" y="1888" text-anchor="middle">已追回</text><rect class="label-mask" x="628" y="1863" width="72" height="12" rx="2"/><text class="edge-label" x="664" y="1872" text-anchor="middle">退款失败待人工</text><rect class="start" x="869" y="24" width="208" height="56" rx="28"/><text class="node-title" x="973" y="48" text-anchor="middle">发起退款</text><text class="node-sub" x="973" y="66" text-anchor="middle">居民申请 / 平台 PC 创建 / 过期系统任务</text><polygon class="decision" points="973,200 1137,256 973,312 809,256"/><text class="node-title" x="973" y="251" text-anchor="middle">订单状态 == 已核销？</text><text class="node-sub decision-sub" x="973" y="269" text-anchor="middle">按主单状态决定退款单走向</text><polygon class="decision" points="700,576 980,632 700,688 420,632"/><text class="node-title" x="700" y="627" text-anchor="middle">触发方 == 用户申请？</text><text class="node-sub decision-sub" x="700" y="645" text-anchor="middle">未核销分支：用户申请免审核；平台/系统创建走人工审核</text><rect class="step" x="178" y="800" width="296" height="56" rx="6"/><text class="node-title" x="326" y="824" text-anchor="middle">创建退款记录（人工审核）</text><text class="node-sub" x="326" y="842" text-anchor="middle">订单转[退款中]；核销码隐藏、核销接口拒绝；创建后走人工审核</text><rect class="step" x="236" y="1000" width="180" height="56" rx="6"/><text class="node-title" x="326" y="1024" text-anchor="middle">平台人工审核</text><text class="node-sub" x="326" y="1042" text-anchor="middle">审核弹窗动作；触发[售后状态]变更</text><polygon class="decision" points="326,1176 474,1232 326,1288 178,1232"/><text class="node-title" x="326" y="1227" text-anchor="middle">退款审核是否通过？</text><text class="node-sub decision-sub" x="326" y="1245" text-anchor="middle">人工审核动作完成后判定</text><rect class="step" x="468" y="976" width="376" height="56" rx="6"/><text class="node-title" x="656" y="1000" text-anchor="middle">创建退款记录（免审核）</text><text class="node-sub" x="656" y="1018" text-anchor="middle">用户申请自动审核通过，记录创建后直接进入微信退款；订单转[退款中]、核销码隐藏</text><rect class="step" x="1133" y="400" width="308" height="56" rx="6"/><text class="node-title" x="1287" y="424" text-anchor="middle">创建退款记录（已核销）</text><text class="node-sub" x="1287" y="442" text-anchor="middle">居民不可直接退款（联系客服）；仅平台/系统触发；订单转[退款中]</text><rect class="step" x="1197" y="600" width="180" height="56" rx="6"/><text class="node-title" x="1287" y="624" text-anchor="middle">平台人工审核</text><text class="node-sub" x="1287" y="642" text-anchor="middle">审核弹窗动作；触发[售后状态]变更</text><polygon class="decision" points="1287,776 1435,832 1287,888 1139,832"/><text class="node-title" x="1287" y="827" text-anchor="middle">退款审核是否通过？</text><text class="node-sub decision-sub" x="1287" y="845" text-anchor="middle">人工审核动作完成后判定</text><rect class="step" x="468" y="1376" width="304" height="56" rx="6"/><text class="node-title" x="620" y="1400" text-anchor="middle">微信全额退款</text><text class="node-sub" x="620" y="1418" text-anchor="middle">[售后状态=微信退款中]；金额=订单实付；失败自动重试最多 3 次</text><rect class="error" x="460" y="1764" width="320" height="56" rx="6"/><text class="node-title" x="620" y="1788" text-anchor="middle">3 次重试仍失败</text><text class="node-sub" x="620" y="1806" text-anchor="middle">[售后状态=退款失败待人工]；订单保持[退款中]；失败原因弹窗可重试</text><rect class="success" x="894" y="1588" width="200" height="56" rx="6"/><text class="node-title" x="994" y="1612" text-anchor="middle">微信退款成功</text><text class="node-sub" x="994" y="1630" text-anchor="middle">[订单状态=已退款]；[售后状态=已退款]</text><rect class="step" x="844" y="1764" width="300" height="56" rx="6"/><text class="node-title" x="994" y="1788" text-anchor="middle">分账记录转「已终止（退款）」</text><text class="node-sub" x="994" y="1806" text-anchor="middle">[分账状态=已终止（退款）]；由退款流程回写，每日任务不再执行</text><rect class="step" x="1142" y="1200" width="344" height="56" rx="6"/><text class="node-title" x="1314" y="1224" text-anchor="middle">平台垫付</text><text class="node-sub" x="1314" y="1242" text-anchor="middle">[订单状态=已退款]；[售后状态=已退款待追回]；不调微信退款、不分账回退</text><rect class="step" x="1166" y="1408" width="296" height="56" rx="6"/><text class="node-title" x="1314" y="1432" text-anchor="middle">售后=已退款待追回</text><text class="node-sub" x="1314" y="1450" text-anchor="middle">[订单状态=已退款]；[售后状态=已退款待追回]；分账保持已分账</text><rect class="step" x="1158" y="1588" width="312" height="56" rx="6"/><text class="node-title" x="1314" y="1612" text-anchor="middle">记录追回（一次性）</text><text class="node-sub" x="1314" y="1630" text-anchor="middle">[售后状态=已追回]；一次性回填：实际追回金额/追回时间/追回备注</text><rect class="success" x="1220" y="1796" width="188" height="56" rx="6"/><text class="node-title" x="1314" y="1820" text-anchor="middle">售后=已追回</text><text class="node-sub" x="1314" y="1838" text-anchor="middle">平台损失=微信手续费+商家未追回金额</text><rect class="step" x="896" y="1996" width="196" height="56" rx="6"/><text class="node-title" x="994" y="2020" text-anchor="middle">退款终态回写</text><text class="node-sub" x="994" y="2038" text-anchor="middle">订单/售后/分账记录按分支最终状态更新</text><rect class="end" x="922" y="2172" width="144" height="44" rx="22"/><text class="node-title end-text" x="994" y="2198" text-anchor="middle">流程结束</text><polygon class="decision" points="1084,976 1248,1032 1084,1088 920,1032"/><text class="node-title" x="1084" y="1027" text-anchor="middle">分账状态 == 已分账？</text><text class="node-sub decision-sub" x="1084" y="1045" text-anchor="middle">审核通过时检查分账状态</text></svg></main></body></html>
