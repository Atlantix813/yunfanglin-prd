<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">免费券领取流程</h1><p class="sub">0 元订单，无支付、无分账、无退款。</p><svg width="100%" viewBox="0 0 864 1588" role="img" aria-labelledby="free-title free-desc"><title id="free-title">免费券领取流程</title><desc id="free-desc">免费券领取后生成 0 元订单，不进入支付和分账；过期仅状态标记，无退款动作。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 312 80 L 312 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 178 256 L 104 256 L 104 400" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 446 256 L 504 256 L 504 400" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 504 456 L 504 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 504 632 L 504 752" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 504 808 L 504 928" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 370 984 L 304 984 L 304 1128" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 638 984 L 712 984 L 712 1128" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 712 1184 L 712 1304" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 712 1360 L 712 1480" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="117" y="236" width="48" height="12" rx="2"/><text class="edge-label" x="141" y="245" text-anchor="middle">库存不足</text><rect class="label-mask" x="459" y="236" width="32" height="12" rx="2"/><text class="edge-label" x="475" y="245" text-anchor="middle">充足</text><rect class="label-mask" x="317" y="964" width="40" height="12" rx="2"/><text class="edge-label" x="337" y="973" text-anchor="middle">已过期</text><rect class="label-mask" x="651" y="964" width="48" height="12" rx="2"/><text class="edge-label" x="675" y="973" text-anchor="middle">有效期内</text><rect class="start" x="238" y="24" width="148" height="56" rx="28"/><text class="node-title" x="312" y="48" text-anchor="middle">居民领取免费券</text><text class="node-sub" x="312" y="66" text-anchor="middle">代金券详情页（free 状态）</text><polygon class="decision" points="312,200 446,256 312,312 178,256"/><text class="node-title" x="312" y="251" text-anchor="middle">剩余库存 &gt; 0？</text><text class="node-sub decision-sub" x="312" y="269" text-anchor="middle">voucher_goods.stock</text><rect class="error" x="32" y="400" width="144" height="56" rx="6"/><text class="node-title" x="104" y="424" text-anchor="middle">已领完</text><text class="node-sub" x="104" y="442" text-anchor="middle">展示提示：免费券已领完</text><rect class="step" x="398" y="400" width="212" height="56" rx="6"/><text class="node-title" x="504" y="424" text-anchor="middle">创建订单记录</text><text class="node-sub" x="504" y="442" text-anchor="middle">voucher_order.type=[free]；实付金额=0</text><rect class="step" x="426" y="576" width="156" height="56" rx="6"/><text class="node-title" x="504" y="600" text-anchor="middle">生成核销码</text><text class="node-sub" x="504" y="618" text-anchor="middle">voucher_order.verify_code</text><rect class="step" x="416" y="752" width="176" height="56" rx="6"/><text class="node-title" x="504" y="776" text-anchor="middle">写入状态=已领取</text><text class="node-sub" x="504" y="794" text-anchor="middle">voucher_order.status=[已领取]</text><polygon class="decision" points="504,928 638,984 504,1040 370,984"/><text class="node-title" x="504" y="979" text-anchor="middle">是否在有效期内？</text><text class="node-sub decision-sub" x="504" y="997" text-anchor="middle">有效期结束时间</text><rect class="error" x="232" y="1128" width="144" height="56" rx="6"/><text class="node-title" x="304" y="1152" text-anchor="middle">已过期</text><text class="node-sub" x="304" y="1170" text-anchor="middle">仅状态标记，无退款动作</text><rect class="step" x="624" y="1128" width="176" height="56" rx="6"/><text class="node-title" x="712" y="1152" text-anchor="middle">核销（走到店核销流程）</text><text class="node-sub" x="712" y="1170" text-anchor="middle">同 flow-verify；免费券无资金流</text><rect class="success" x="640" y="1304" width="144" height="56" rx="6"/><text class="node-title" x="712" y="1328" text-anchor="middle">核销成功</text><text class="node-sub" x="712" y="1346" text-anchor="middle">免费券订单已核销</text><rect class="end" x="640" y="1480" width="144" height="44" rx="22"/><text class="node-title end-text" x="712" y="1506" text-anchor="middle">流程结束</text></svg></main></body></html>
