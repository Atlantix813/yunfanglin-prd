<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">分账记录流程</h1><p class="sub">付费券核销 → 创建分账记录（待分账）→ 到预计分账日期 → 已分账 / 分账异常；微信退款成功后转「已终止（退款）」。</p><svg width="100%" viewBox="0 0 1407 1940" role="img" aria-labelledby="flow-profit-title flow-profit-desc"><title id="flow-profit-title">分账记录流程</title><desc id="flow-profit-desc">分账记录在付费券核销后创建（状态=待分账）；每日分账任务在达到预计分账日期时执行（唯一条件：分账状态=待分账且到期，不判断订单主状态）；分账成功=已分账，失败重试仍败=分账异常；未分账订单微信退款成功后分账记录转「已终止（退款）」；已分账订单退款不分账回退，分账保持已分账。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 627 80 L 627 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 627 268 L 627 388" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 479 458 L 387 458 L 387 616" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 775 458 L 841 458 L 841 616" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 387 696 L 387 872" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 547 686 L 481 686 L 481 872" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 434 940 L 434 1832" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1135 686 L 1217 686 L 1217 794 L 999 794 L 999 908" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1223 1186 L 1281 1186 L 1281 1601.3333333333333" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 775 1186 L 717 1186 L 717 1344" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 851 1414 L 1217 1414 L 1217 1601.3333333333333" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 583 1414 L 517 1414 L 517 1622" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 1249 1681.3333333333333 L 1249 1764 L 493 1764 L 493 1832" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 517 1690 L 517 1754 L 464 1754 L 464 1832" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 228 1624 L 228 1754 L 405 1754 L 405 1832" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 999 988 L 999 1116" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="417" y="438" width="32" height="12" rx="2"/><text class="edge-label" x="433" y="447" text-anchor="middle">延长</text><rect class="label-mask" x="788" y="438" width="40" height="12" rx="2"/><text class="edge-label" x="808" y="447" text-anchor="middle">不延长</text><rect class="label-mask" x="395" y="778" width="72" height="12" rx="2"/><text class="edge-label" x="431" y="787" text-anchor="middle">重设日期后等待</text><rect class="label-mask" x="494" y="666" width="40" height="12" rx="2"/><text class="edge-label" x="514" y="675" text-anchor="middle">未到期</text><rect class="label-mask" x="442" y="1380" width="72" height="12" rx="2"/><text class="edge-label" x="478" y="1389" text-anchor="middle">次日任务再扫描</text><rect class="label-mask" x="1148" y="666" width="56" height="12" rx="2"/><text class="edge-label" x="1176" y="675" text-anchor="middle">到期·执行</text><rect class="label-mask" x="1236" y="1166" width="32" height="12" rx="2"/><text class="edge-label" x="1252" y="1175" text-anchor="middle">成功</text><rect class="label-mask" x="730" y="1166" width="32" height="12" rx="2"/><text class="edge-label" x="746" y="1175" text-anchor="middle">失败</text><rect class="label-mask" x="1010" y="1394" width="48" height="12" rx="2"/><text class="edge-label" x="1034" y="1403" text-anchor="middle">重试成功</text><rect class="label-mask" x="530" y="1394" width="40" height="12" rx="2"/><text class="edge-label" x="550" y="1403" text-anchor="middle">仍失败</text><rect class="label-mask" x="236" y="1683" width="104" height="12" rx="2"/><text class="edge-label" x="288" y="1692" text-anchor="middle">来自退款流程的状态回写</text><rect class="start" x="555" y="24" width="144" height="56" rx="28"/><text class="node-title" x="627" y="48" text-anchor="middle">付费券核销</text><text class="node-sub" x="627" y="64" text-anchor="middle">核销成功触发</text><rect class="step" x="539" y="200" width="176" height="68" rx="6"/><text class="node-title" x="627" y="224" text-anchor="middle">创建分账记录</text><text class="node-sub" x="627" y="240" text-anchor="middle">分账状态=待分账；</text><text class="node-sub" x="627" y="252" text-anchor="middle">固化预计分账日期（核销后 T 天）</text><polygon class="decision" points="627,388 775,458 627,528 479,458"/><text class="node-title" x="627" y="453" text-anchor="middle">是否延长分账时间？</text><text class="node-sub decision-sub" x="627" y="468" text-anchor="middle">PC 分账页人工操作分支</text><rect class="step" x="309" y="616" width="156" height="80" rx="6"/><text class="node-title" x="387" y="640" text-anchor="middle">延长分账时间</text><text class="node-sub" x="387" y="656" text-anchor="middle">[分账状态=待分账]（不变）；</text><text class="node-sub" x="387" y="668" text-anchor="middle">[预计分账日期] 重设；记录操作人/原因/时间</text><polygon class="decision" points="841,616 1135,686 841,756 547,686"/><text class="node-title" x="841" y="681" text-anchor="middle">是否到达预计分账日期？</text><text class="node-sub decision-sub" x="841" y="696" text-anchor="middle">每日分账任务唯一条件（待分账且到期，不判断订单主状态）</text><rect class="step" x="909" y="908" width="180" height="80" rx="6"/><text class="node-title" x="999" y="932" text-anchor="middle">微信分账执行</text><text class="node-sub" x="999" y="948" text-anchor="middle">每日任务调用分账接口；抽佣→平台商户号；</text><text class="node-sub" x="999" y="960" text-anchor="middle">剩余解冻→商家；触发[分账状态]变更</text><rect class="step" x="296" y="872" width="276" height="68" rx="6"/><text class="node-title" x="434" y="896" text-anchor="middle">等待次日任务扫描</text><text class="node-sub" x="434" y="912" text-anchor="middle">分账状态保持待分账；</text><text class="node-sub" x="434" y="924" text-anchor="middle">退款成功会先行将记录转为已终止（退款），不再进入本任务</text><polygon class="decision" points="999,1116 1223,1186 999,1256 775,1186"/><text class="node-title" x="999" y="1181" text-anchor="middle">分账是否执行成功？</text><text class="node-sub decision-sub" x="999" y="1196" text-anchor="middle">分账执行动作完成后判定（接收方 result）</text><rect class="success" x="1155" y="1601.3333333333333" width="188" height="80" rx="6"/><text class="node-title" x="1249" y="1625.3333333333333" text-anchor="middle">已分账</text><text class="node-sub" x="1249" y="1641.3333333333333" text-anchor="middle">[分账状态=已分账]；回写[分账完成时间]；</text><text class="node-sub" x="1249" y="1653.3333333333333" text-anchor="middle">已分账订单退款保持已分账不分账回退</text><polygon class="decision" points="717,1344 851,1414 717,1484 583,1414"/><text class="node-title" x="717" y="1409" text-anchor="middle">重试后是否成功？</text><text class="node-sub decision-sub" x="717" y="1424" text-anchor="middle">自动重试（原单重试）</text><rect class="error" x="445" y="1622" width="144" height="68" rx="6"/><text class="node-title" x="517" y="1646" text-anchor="middle">分账异常</text><text class="node-sub" x="517" y="1662" text-anchor="middle">[分账状态=分账异常]；PC 分账页人工处理</text><rect class="error" x="32" y="1568" width="392" height="56" rx="6"/><text class="node-title" x="228" y="1592" text-anchor="middle">已终止（退款）</text><text class="node-sub" x="228" y="1608" text-anchor="middle">来自退款流程：微信退款成功后分账记录转此状态，天然不满足待分账条件，任务不再执行</text><rect class="end" x="377" y="1832" width="144" height="44" rx="22"/><text class="node-title end-text" x="449" y="1858" text-anchor="middle">流程结束</text></svg></main></body></html>
