<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">分账记录流程</h1><p class="sub">付费券核销 → 创建分账记录（待分账）→ 到预计分账日期 → 已分账 / 分账异常；微信退款成功后转「已终止（退款）」。</p><svg width="100%" viewBox="0 0 1443 1724" role="img" aria-labelledby="flow-profit-title flow-profit-desc"><title id="flow-profit-title">分账记录流程</title><desc id="flow-profit-desc">分账记录在付费券核销后创建（状态=待分账）；每日分账任务在达到预计分账日期时执行（唯一条件：分账状态=待分账且到期，不判断订单主状态）；分账成功=已分账，失败重试仍败=分账异常；未分账订单微信退款成功后分账记录转「已终止（退款）」；已分账订单退款不分账回退，分账保持已分账。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 340 80 L 340 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 340 256 L 340 376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 192 432 L 134 432 L 134 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 488 432 L 554 432 L 554 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 330 632 L 264 632 L 264 808" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 239 864 L 239 1538 L 317 1538 L 317 1616" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 778 632 L 836 632 L 836 808" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 668 864 L 346 864 L 346 1264" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 1004 864 L 1054 864 L 1054 1040" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1232 1096 L 1290 1096 L 1290 1440" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 876 1096 L 818 1096 L 818 1240" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 952 1296 L 1200 1296 L 1200 1440" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 684 1296 L 452 1296 L 452 1440" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 1245 1496 L 1245 1548 L 405 1548 L 405 1616" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 452 1496 L 452 1538 L 376 1538 L 376 1616" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 346 1320 L 346 1616" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 134 632 L 134 730 L 214 730 L 214 808" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="147" y="412" width="32" height="12" rx="2"/><text class="edge-label" x="163" y="421" text-anchor="middle">延长</text><rect class="label-mask" x="501" y="412" width="40" height="12" rx="2"/><text class="edge-label" x="521" y="421" text-anchor="middle">不延长</text><rect class="label-mask" x="277" y="612" width="40" height="12" rx="2"/><text class="edge-label" x="297" y="621" text-anchor="middle">未到期</text><rect class="label-mask" x="247" y="1195" width="72" height="12" rx="2"/><text class="edge-label" x="283" y="1204" text-anchor="middle">次日任务再扫描</text><rect class="label-mask" x="791" y="612" width="32" height="12" rx="2"/><text class="edge-label" x="807" y="621" text-anchor="middle">到期</text><rect class="label-mask" x="475" y="844" width="64" height="12" rx="2"/><text class="edge-label" x="507" y="853" text-anchor="middle">是·退款终止</text><rect class="label-mask" x="1017" y="844" width="24" height="12" rx="2"/><text class="edge-label" x="1029" y="853" text-anchor="middle">否</text><rect class="label-mask" x="1245" y="1076" width="32" height="12" rx="2"/><text class="edge-label" x="1261" y="1085" text-anchor="middle">成功</text><rect class="label-mask" x="831" y="1076" width="32" height="12" rx="2"/><text class="edge-label" x="847" y="1085" text-anchor="middle">失败</text><rect class="label-mask" x="1052" y="1276" width="48" height="12" rx="2"/><text class="edge-label" x="1076" y="1285" text-anchor="middle">重试成功</text><rect class="label-mask" x="548" y="1276" width="40" height="12" rx="2"/><text class="edge-label" x="568" y="1285" text-anchor="middle">仍失败</text><rect class="label-mask" x="142" y="675" width="72" height="12" rx="2"/><text class="edge-label" x="178" y="684" text-anchor="middle">重设日期后等待</text><rect class="start" x="268" y="24" width="144" height="56" rx="28"/><text class="node-title" x="340" y="48" text-anchor="middle">付费券核销</text><text class="node-sub" x="340" y="66" text-anchor="middle">核销成功触发</text><rect class="step" x="214" y="200" width="252" height="56" rx="6"/><text class="node-title" x="340" y="224" text-anchor="middle">创建分账记录</text><text class="node-sub" x="340" y="242" text-anchor="middle">分账状态=待分账；固化预计分账日期（核销后 T 天）</text><polygon class="decision" points="340,376 488,432 340,488 192,432"/><text class="node-title" x="340" y="427" text-anchor="middle">是否延长分账时间？</text><text class="node-sub decision-sub" x="340" y="445" text-anchor="middle">PC 分账页人工操作分支</text><rect class="step" x="32" y="576" width="204" height="56" rx="6"/><text class="node-title" x="134" y="600" text-anchor="middle">延长分账时间</text><text class="node-sub" x="134" y="618" text-anchor="middle">重设预计分账日期；记录操作人/原因/时间</text><polygon class="decision" points="554,576 778,632 554,688 330,632"/><text class="node-title" x="554" y="627" text-anchor="middle">是否到达预计分账日期？</text><text class="node-sub decision-sub" x="554" y="645" text-anchor="middle">每日分账任务唯一条件（不判断订单主状态）</text><rect class="step" x="167" y="808" width="144" height="56" rx="6"/><text class="node-title" x="239" y="832" text-anchor="middle">等待次日任务扫描</text><text class="node-sub" x="239" y="850" text-anchor="middle">分账状态保持待分账</text><polygon class="decision" points="836,808 1004,864 836,920 668,864"/><text class="node-title" x="836" y="859" text-anchor="middle">是否被微信退款终止？</text><text class="node-sub decision-sub" x="836" y="877" text-anchor="middle">退款审核通过走微信退款且成功</text><rect class="error" x="250" y="1264" width="192" height="56" rx="6"/><text class="node-title" x="346" y="1288" text-anchor="middle">已终止（退款）</text><text class="node-sub" x="346" y="1306" text-anchor="middle">终止原因=微信退款成功；不再执行分账</text><polygon class="decision" points="1054,1040 1232,1096 1054,1152 876,1096"/><text class="node-title" x="1054" y="1091" text-anchor="middle">分账是否执行成功？</text><text class="node-sub decision-sub" x="1054" y="1109" text-anchor="middle">抽佣→平台商户号；剩余解冻→商家</text><rect class="success" x="1111" y="1440" width="268" height="56" rx="6"/><text class="node-title" x="1245" y="1464" text-anchor="middle">已分账</text><text class="node-sub" x="1245" y="1482" text-anchor="middle">回写分账完成时间；已分账订单退款保持已分账不分账回退</text><polygon class="decision" points="818,1240 952,1296 818,1352 684,1296"/><text class="node-title" x="818" y="1291" text-anchor="middle">重试后是否成功？</text><text class="node-sub decision-sub" x="818" y="1309" text-anchor="middle">自动重试（原单重试）</text><rect class="error" x="380" y="1440" width="144" height="56" rx="6"/><text class="node-title" x="452" y="1464" text-anchor="middle">分账异常</text><text class="node-sub" x="452" y="1482" text-anchor="middle">PC 分账页人工处理</text><rect class="end" x="289" y="1616" width="144" height="44" rx="22"/><text class="node-title end-text" x="361" y="1642" text-anchor="middle">流程结束</text></svg></main></body></html>
