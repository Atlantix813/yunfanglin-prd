<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">分账记录流程</h1><p class="sub">付费券核销 → 创建分账记录（待分账）→ 到预计分账日期 → 已分账 / 分账异常；微信退款成功后转「已终止（退款）」。</p><svg width="100%" viewBox="0 0 1498 1808" role="img" aria-labelledby="flow-profit-title flow-profit-desc"><title id="flow-profit-title">分账记录流程</title><desc id="flow-profit-desc">分账记录在付费券核销后创建（状态=待分账）；每日分账任务在达到预计分账日期时执行（唯一条件：分账状态=待分账且到期，不判断订单主状态）；分账成功=已分账，失败重试仍败=分账异常；未分账订单微信退款成功后分账记录转「已终止（退款）」；已分账订单退款不分账回退，分账保持已分账。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 642 80 L 642 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 642 256 L 642 376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 494 432 L 314 432 L 314 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 790 432 L 856 432 L 856 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 314 632 L 314 730 L 372 730 L 372 808" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 562 632 L 496 632 L 496 808" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 434 864 L 434 1700" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1150 632 L 1232 632 L 1232 730 L 1031 730 L 1031 850" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1255 1096 L 1313 1096 L 1313 1477.3333333333333" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 807 1096 L 749 1096 L 749 1240" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 883 1296 L 1191 1296 L 1191 1477.3333333333333" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 615 1296 L 549 1296 L 549 1496" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 1252 1533.3333333333333 L 1252 1632 L 493 1632 L 493 1700" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 549 1552 L 549 1622 L 464 1622 L 464 1700" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 228 1492 L 228 1622 L 405 1622 L 405 1700" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1031 906 L 1031 1040" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="388" y="412" width="32" height="12" rx="2"/><text class="edge-label" x="404" y="421" text-anchor="middle">延长</text><rect class="label-mask" x="803" y="412" width="40" height="12" rx="2"/><text class="edge-label" x="823" y="421" text-anchor="middle">不延长</text><rect class="label-mask" x="322" y="675" width="72" height="12" rx="2"/><text class="edge-label" x="358" y="684" text-anchor="middle">重设日期后等待</text><rect class="label-mask" x="509" y="612" width="40" height="12" rx="2"/><text class="edge-label" x="529" y="621" text-anchor="middle">未到期</text><rect class="label-mask" x="442" y="1276" width="72" height="12" rx="2"/><text class="edge-label" x="478" y="1285" text-anchor="middle">次日任务再扫描</text><rect class="label-mask" x="1163" y="612" width="56" height="12" rx="2"/><text class="edge-label" x="1191" y="621" text-anchor="middle">到期·执行</text><rect class="label-mask" x="1268" y="1076" width="32" height="12" rx="2"/><text class="edge-label" x="1284" y="1085" text-anchor="middle">成功</text><rect class="label-mask" x="762" y="1076" width="32" height="12" rx="2"/><text class="edge-label" x="778" y="1085" text-anchor="middle">失败</text><rect class="label-mask" x="1013" y="1276" width="48" height="12" rx="2"/><text class="edge-label" x="1037" y="1285" text-anchor="middle">重试成功</text><rect class="label-mask" x="562" y="1276" width="40" height="12" rx="2"/><text class="edge-label" x="582" y="1285" text-anchor="middle">仍失败</text><rect class="label-mask" x="236" y="1551" width="104" height="12" rx="2"/><text class="edge-label" x="288" y="1560" text-anchor="middle">来自退款流程的状态回写</text><rect class="start" x="570" y="24" width="144" height="56" rx="28"/><text class="node-title" x="642" y="48" text-anchor="middle">付费券核销</text><text class="node-sub" x="642" y="66" text-anchor="middle">核销成功触发</text><rect class="step" x="516" y="200" width="252" height="56" rx="6"/><text class="node-title" x="642" y="224" text-anchor="middle">创建分账记录</text><text class="node-sub" x="642" y="242" text-anchor="middle">分账状态=待分账；固化预计分账日期（核销后 T 天）</text><polygon class="decision" points="642,376 790,432 642,488 494,432"/><text class="node-title" x="642" y="427" text-anchor="middle">是否延长分账时间？</text><text class="node-sub decision-sub" x="642" y="445" text-anchor="middle">PC 分账页人工操作分支</text><rect class="step" x="142" y="576" width="344" height="56" rx="6"/><text class="node-title" x="314" y="600" text-anchor="middle">延长分账时间</text><text class="node-sub" x="314" y="618" text-anchor="middle">[分账状态=待分账]（不变）；[预计分账日期] 重设；记录操作人/原因/时间</text><polygon class="decision" points="856,576 1150,632 856,688 562,632"/><text class="node-title" x="856" y="627" text-anchor="middle">是否到达预计分账日期？</text><text class="node-sub decision-sub" x="856" y="645" text-anchor="middle">每日分账任务唯一条件（待分账且到期，不判断订单主状态）</text><rect class="step" x="851" y="850" width="360" height="56" rx="6"/><text class="node-title" x="1031" y="874" text-anchor="middle">微信分账执行</text><text class="node-sub" x="1031" y="892" text-anchor="middle">每日任务调用分账接口；抽佣→平台商户号；剩余解冻→商家；触发[分账状态]变更</text><rect class="step" x="250" y="808" width="368" height="56" rx="6"/><text class="node-title" x="434" y="832" text-anchor="middle">等待次日任务扫描</text><text class="node-sub" x="434" y="850" text-anchor="middle">分账状态保持待分账；退款成功会先行将记录转为已终止（退款），不再进入本任务</text><polygon class="decision" points="1031,1040 1255,1096 1031,1152 807,1096"/><text class="node-title" x="1031" y="1091" text-anchor="middle">分账是否执行成功？</text><text class="node-sub decision-sub" x="1031" y="1109" text-anchor="middle">分账执行动作完成后判定（接收方 result）</text><rect class="success" x="1070" y="1477.3333333333333" width="364" height="56" rx="6"/><text class="node-title" x="1252" y="1501.3333333333333" text-anchor="middle">已分账</text><text class="node-sub" x="1252" y="1519.3333333333333" text-anchor="middle">[分账状态=已分账]；回写[分账完成时间]；已分账订单退款保持已分账不分账回退</text><polygon class="decision" points="749,1240 883,1296 749,1352 615,1296"/><text class="node-title" x="749" y="1291" text-anchor="middle">重试后是否成功？</text><text class="node-sub decision-sub" x="749" y="1309" text-anchor="middle">自动重试（原单重试）</text><rect class="error" x="445" y="1496" width="208" height="56" rx="6"/><text class="node-title" x="549" y="1520" text-anchor="middle">分账异常</text><text class="node-sub" x="549" y="1538" text-anchor="middle">[分账状态=分账异常]；PC 分账页人工处理</text><rect class="error" x="32" y="1436" width="392" height="56" rx="6"/><text class="node-title" x="228" y="1460" text-anchor="middle">已终止（退款）</text><text class="node-sub" x="228" y="1478" text-anchor="middle">来自退款流程：微信退款成功后分账记录转此状态，天然不满足待分账条件，任务不再执行</text><rect class="end" x="377" y="1700" width="144" height="44" rx="22"/><text class="node-title end-text" x="449" y="1726" text-anchor="middle">流程结束</text></svg></main></body></html>
