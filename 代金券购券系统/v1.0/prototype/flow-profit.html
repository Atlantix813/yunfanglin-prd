<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">分账记录流程</h1><p class="sub">付费券核销 → 创建分账记录（待分账）→ 到预计分账日期 → 已分账 / 分账异常；微信退款成功后转「已终止（退款）」。</p><svg width="100%" viewBox="0 0 1403 1608" role="img" aria-labelledby="flow-profit-title flow-profit-desc"><title id="flow-profit-title">分账记录流程</title><desc id="flow-profit-desc">分账记录在付费券核销后创建（状态=待分账）；每日分账任务在达到预计分账日期时执行（唯一条件：分账状态=待分账且到期，不判断订单主状态）；分账成功=已分账，失败重试仍败=分账异常；未分账订单微信退款成功后分账记录转「已终止（退款）」；已分账订单退款不分账回退，分账保持已分账。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 424 80 L 424 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 424 256 L 424 376" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 276 432 L 154 432 L 154 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 572 432 L 638 432 L 638 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 154 632 L 154 808" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 344 632 L 278 632 L 278 808" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 216 864 L 216 1422 L 270 1422 L 270 1500" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 932 632 L 1014 632 L 1014 808" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1192 864 L 1250 864 L 1250 1277.3333333333333" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 836 864 L 778 864 L 778 1040" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 912 1096 L 1160 1096 L 1160 1277.3333333333333" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 644 1096 L 299 1096 L 299 1296" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 1205 1333.3333333333333 L 1205 1432 L 358 1432 L 358 1500" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 299 1352 L 299 1500" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 631 1292 L 631 1422 L 329 1422 L 329 1500" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="199" y="412" width="32" height="12" rx="2"/><text class="edge-label" x="215" y="421" text-anchor="middle">延长</text><rect class="label-mask" x="585" y="412" width="40" height="12" rx="2"/><text class="edge-label" x="605" y="421" text-anchor="middle">不延长</text><rect class="label-mask" x="162" y="714" width="72" height="12" rx="2"/><text class="edge-label" x="198" y="723" text-anchor="middle">重设日期后等待</text><rect class="label-mask" x="291" y="612" width="40" height="12" rx="2"/><text class="edge-label" x="311" y="621" text-anchor="middle">未到期</text><rect class="label-mask" x="224" y="1137" width="72" height="12" rx="2"/><text class="edge-label" x="260" y="1146" text-anchor="middle">次日任务再扫描</text><rect class="label-mask" x="945" y="612" width="56" height="12" rx="2"/><text class="edge-label" x="973" y="621" text-anchor="middle">到期·执行</text><rect class="label-mask" x="1205" y="844" width="32" height="12" rx="2"/><text class="edge-label" x="1221" y="853" text-anchor="middle">成功</text><rect class="label-mask" x="791" y="844" width="32" height="12" rx="2"/><text class="edge-label" x="807" y="853" text-anchor="middle">失败</text><rect class="label-mask" x="1012" y="1076" width="48" height="12" rx="2"/><text class="edge-label" x="1036" y="1085" text-anchor="middle">重试成功</text><rect class="label-mask" x="451.5" y="1076" width="40" height="12" rx="2"/><text class="edge-label" x="471.5" y="1085" text-anchor="middle">仍失败</text><rect class="label-mask" x="639" y="1351" width="104" height="12" rx="2"/><text class="edge-label" x="691" y="1360" text-anchor="middle">来自退款流程的状态回写</text><rect class="start" x="352" y="24" width="144" height="56" rx="28"/><text class="node-title" x="424" y="48" text-anchor="middle">付费券核销</text><text class="node-sub" x="424" y="66" text-anchor="middle">核销成功触发</text><rect class="step" x="298" y="200" width="252" height="56" rx="6"/><text class="node-title" x="424" y="224" text-anchor="middle">创建分账记录</text><text class="node-sub" x="424" y="242" text-anchor="middle">分账状态=待分账；固化预计分账日期（核销后 T 天）</text><polygon class="decision" points="424,376 572,432 424,488 276,432"/><text class="node-title" x="424" y="427" text-anchor="middle">是否延长分账时间？</text><text class="node-sub decision-sub" x="424" y="445" text-anchor="middle">PC 分账页人工操作分支</text><rect class="step" x="52" y="576" width="204" height="56" rx="6"/><text class="node-title" x="154" y="600" text-anchor="middle">延长分账时间</text><text class="node-sub" x="154" y="618" text-anchor="middle">重设预计分账日期；记录操作人/原因/时间</text><polygon class="decision" points="638,576 932,632 638,688 344,632"/><text class="node-title" x="638" y="627" text-anchor="middle">是否到达预计分账日期？</text><text class="node-sub decision-sub" x="638" y="645" text-anchor="middle">每日分账任务唯一条件（待分账且到期，不判断订单主状态）</text><rect class="step" x="32" y="808" width="368" height="56" rx="6"/><text class="node-title" x="216" y="832" text-anchor="middle">等待次日任务扫描</text><text class="node-sub" x="216" y="850" text-anchor="middle">分账状态保持待分账；退款成功会先行将记录转为已终止（退款），不再进入本任务</text><polygon class="decision" points="1014,808 1192,864 1014,920 836,864"/><text class="node-title" x="1014" y="859" text-anchor="middle">分账是否执行成功？</text><text class="node-sub decision-sub" x="1014" y="877" text-anchor="middle">抽佣→平台商户号；剩余解冻→商家</text><rect class="success" x="1071" y="1277.3333333333333" width="268" height="56" rx="6"/><text class="node-title" x="1205" y="1301.3333333333333" text-anchor="middle">已分账</text><text class="node-sub" x="1205" y="1319.3333333333333" text-anchor="middle">回写分账完成时间；已分账订单退款保持已分账不分账回退</text><polygon class="decision" points="778,1040 912,1096 778,1152 644,1096"/><text class="node-title" x="778" y="1091" text-anchor="middle">重试后是否成功？</text><text class="node-sub decision-sub" x="778" y="1109" text-anchor="middle">自动重试（原单重试）</text><rect class="error" x="227" y="1296" width="144" height="56" rx="6"/><text class="node-title" x="299" y="1320" text-anchor="middle">分账异常</text><text class="node-sub" x="299" y="1338" text-anchor="middle">PC 分账页人工处理</text><rect class="error" x="435" y="1236" width="392" height="56" rx="6"/><text class="node-title" x="631" y="1260" text-anchor="middle">已终止（退款）</text><text class="node-sub" x="631" y="1278" text-anchor="middle">来自退款流程：微信退款成功后分账记录转此状态，天然不满足待分账条件，任务不再执行</text><rect class="end" x="242" y="1500" width="144" height="44" rx="22"/><text class="node-title end-text" x="314" y="1526" text-anchor="middle">流程结束</text></svg></main></body></html>
