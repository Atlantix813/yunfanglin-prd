<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">商家进件流程（异常分支）</h1><p class="sub">进件申请单的失败分支处理：驳回（同编号覆盖重提）、作废（重新发起新申请单）。注销流程独立成图。</p><svg width="100%" viewBox="0 0 1194 1060" role="img" aria-labelledby="onboarding-abnormal-title onboarding-abnormal-desc"><title id="onboarding-abnormal-title">商家进件流程（异常分支）</title><desc id="onboarding-abnormal-desc">进件被驳回、30天自动作废、已完成商家注销等异常状态的处理流程。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 474 80 L 474 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 210 256 L 144 256 L 144 600" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 738 256 L 788 256 L 788 400" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 512 456 L 446 456 L 446 600" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 144 656 L 144 698 L 390 698 L 390 776" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 446 656 L 446 776" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 446 832 L 446 952" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1064 456 L 1130 456 L 1130 522 L 530 522 L 530 600" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 530 656 L 530 698 L 502 698 L 502 776" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="157" y="236" width="40" height="12" rx="2"/><text class="edge-label" x="177" y="245" text-anchor="middle">已驳回</text><rect class="label-mask" x="751" y="236" width="24" height="12" rx="2"/><text class="edge-label" x="763" y="245" text-anchor="middle">否</text><rect class="label-mask" x="459" y="436" width="40" height="12" rx="2"/><text class="edge-label" x="479" y="445" text-anchor="middle">已作废</text><rect class="label-mask" x="1077" y="436" width="40" height="12" rx="2"/><text class="edge-label" x="1097" y="445" text-anchor="middle">已作废</text><rect class="start" x="402" y="24" width="144" height="56" rx="28"/><text class="node-title" x="474" y="48" text-anchor="middle">进件异常触发</text><text class="node-sub" x="474" y="66" text-anchor="middle">审核驳回 / 作废</text><polygon class="decision" points="474,200 738,256 474,312 210,256"/><text class="node-title" x="474" y="251" text-anchor="middle">申请单状态 == 已驳回？</text><text class="node-sub decision-sub" x="474" y="269" text-anchor="middle">微信人工审核驳回动作后进入；[申请单状态=已驳回]</text><rect class="step" x="32" y="600" width="224" height="56" rx="6"/><text class="node-title" x="144" y="624" text-anchor="middle">修改资料并重新提交</text><text class="node-sub" x="144" y="642" text-anchor="middle">同编号覆盖重提；提交后 [申请单状态=审核中]</text><polygon class="decision" points="788,400 1064,456 788,512 512,456"/><text class="node-title" x="788" y="451" text-anchor="middle">申请单状态 == 已作废？</text><text class="node-sub decision-sub" x="788" y="469" text-anchor="middle">30 天未处理自动作废动作后进入；[申请单状态=已作废]</text><rect class="step" x="364" y="600" width="248" height="56" rx="6"/><text class="node-title" x="488" y="624" text-anchor="middle">重新发起进件</text><text class="node-sub" x="488" y="642" text-anchor="middle">新业务编号提交；[申请单状态=审核中]（新申请单）</text><rect class="success" x="336" y="776" width="220" height="56" rx="6"/><text class="node-title" x="446" y="800" text-anchor="middle">异常处理完成</text><text class="node-sub" x="446" y="818" text-anchor="middle">[申请单状态=审核中]；重新进入正常审核流转</text><rect class="end" x="374" y="952" width="144" height="44" rx="22"/><text class="node-title end-text" x="446" y="978" text-anchor="middle">流程结束</text></svg></main></body></html>
