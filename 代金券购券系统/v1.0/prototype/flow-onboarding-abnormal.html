<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">商家进件流程（异常分支）</h1><p class="sub">进件申请单的失败分支处理：驳回（同编号覆盖重提）、作废（重新发起新申请单）。注销流程独立成图。</p><svg width="100%" viewBox="0 0 1342 1036" role="img" aria-labelledby="onboarding-abnormal-title onboarding-abnormal-desc"><title id="onboarding-abnormal-title">商家进件流程（异常分支）</title><desc id="onboarding-abnormal-desc">进件被驳回、30天自动作废、已完成商家注销等异常状态的处理流程。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 756 80 L 756 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1084 256 L 1166 256 L 1166 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 428 256 L 346 256 L 346 400" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1166 632 L 1166 674 L 420 674 L 420 752" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 346 456 L 346 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 346 632 L 346 752" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 383 808 L 383 928" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="1097" y="236" width="56" height="12" rx="2"/><text class="edge-label" x="1125" y="245" text-anchor="middle">是·已驳回</text><rect class="label-mask" x="359" y="236" width="56" height="12" rx="2"/><text class="edge-label" x="387" y="245" text-anchor="middle">否·已作废</text><rect class="start" x="572" y="24" width="368" height="56" rx="28"/><text class="node-title" x="756" y="48" text-anchor="middle">进件异常触发</text><text class="node-sub" x="756" y="66" text-anchor="middle">微信人工审核驳回（审核结果回调/查询感知）/ 30 天未处理自动作废（轮询感知）</text><polygon class="decision" points="756,200 1084,256 756,312 428,256"/><text class="node-title" x="756" y="251" text-anchor="middle">申请单状态 == 已驳回？</text><text class="node-sub decision-sub" x="756" y="269" text-anchor="middle">微信人工审核驳回动作后进入此判断（结果通过回调+轮询查询感知）</text><rect class="step" x="1054" y="576" width="224" height="56" rx="6"/><text class="node-title" x="1166" y="600" text-anchor="middle">修改资料并重新提交</text><text class="node-sub" x="1166" y="618" text-anchor="middle">同编号覆盖重提；提交后 [申请单状态=审核中]</text><rect class="step" x="32" y="400" width="628" height="56" rx="6"/><text class="node-title" x="346" y="424" text-anchor="middle">申请单已作废</text><text class="node-sub" x="346" y="442" text-anchor="middle">[申请单状态=已作废]；微信侧 30 天未处理自动作废（服务商无主动撤销能力，也无作废回调——需轮询查询申请状态接口感知）；原申请单不可再用</text><rect class="step" x="222" y="576" width="248" height="56" rx="6"/><text class="node-title" x="346" y="600" text-anchor="middle">重新发起进件</text><text class="node-sub" x="346" y="618" text-anchor="middle">新业务编号提交；[申请单状态=审核中]（新申请单）</text><rect class="success" x="273" y="752" width="220" height="56" rx="6"/><text class="node-title" x="383" y="776" text-anchor="middle">异常处理完成</text><text class="node-sub" x="383" y="794" text-anchor="middle">[申请单状态=审核中]；重新进入正常审核流转</text><rect class="end" x="311" y="928" width="144" height="44" rx="22"/><text class="node-title end-text" x="383" y="954" text-anchor="middle">流程结束</text></svg></main></body></html>
