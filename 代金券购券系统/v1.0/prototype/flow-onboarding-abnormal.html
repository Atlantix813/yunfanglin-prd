<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">商家进件流程（异常分支）</h1><p class="sub">进件申请单的失败分支处理：驳回（同编号覆盖重提）、作废（重新发起新申请单）。注销流程独立成图。</p><svg width="100%" viewBox="0 0 844 1324" role="img" aria-labelledby="onboarding-abnormal-title onboarding-abnormal-desc"><title id="onboarding-abnormal-title">商家进件流程（异常分支）</title><desc id="onboarding-abnormal-desc">进件被驳回、30天自动作废、已完成商家注销等异常状态的处理流程。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 418 80 L 418 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 418 268 L 418 388" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 596 458 L 678 458 L 678 816" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 240 458 L 158 458 L 158 616" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 678 908 L 678 950 L 208 950 L 208 1028" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 158 696 L 158 840" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 158 908 L 158 1028" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 183 1096 L 183 1216" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="609" y="438" width="56" height="12" rx="2"/><text class="edge-label" x="637" y="447" text-anchor="middle">是·已驳回</text><rect class="label-mask" x="171" y="438" width="56" height="12" rx="2"/><text class="edge-label" x="199" y="447" text-anchor="middle">否·已作废</text><rect class="start" x="314" y="24" width="208" height="56" rx="28"/><text class="node-title" x="418" y="48" text-anchor="middle">进件异常触发</text><text class="node-sub" x="418" y="64" text-anchor="middle">微信人工审核驳回 / 30 天未处理自动作废</text><rect class="step" x="308" y="200" width="220" height="68" rx="6"/><text class="node-title" x="418" y="224" text-anchor="middle">状态感知同步</text><text class="node-sub" x="418" y="240" text-anchor="middle">审核结果回调 + 定时轮询查询申请状态 API；</text><text class="node-sub" x="418" y="252" text-anchor="middle">[申请单状态] 同步为微信侧最新值</text><polygon class="decision" points="418,388 596,458 418,528 240,458"/><text class="node-title" x="418" y="453" text-anchor="middle">申请单状态 == 已驳回？</text><text class="node-sub decision-sub" x="418" y="468" text-anchor="middle">基于同步后的最新状态判定</text><rect class="step" x="576" y="816" width="204" height="92" rx="6"/><text class="node-title" x="678" y="840" text-anchor="middle">修改资料并重新提交</text><text class="node-sub" x="678" y="856" text-anchor="middle">驳回后需处理；</text><text class="node-sub" x="678" y="868" text-anchor="middle">我们调修改接口重新提交（同编号覆盖）；</text><text class="node-sub" x="678" y="880" text-anchor="middle">提交后 [申请单状态=审核中]；</text><text class="node-sub" x="678" y="892" text-anchor="middle">超管公众号收驳回通知与进展引导</text><rect class="step" x="32" y="616" width="252" height="80" rx="6"/><text class="node-title" x="158" y="640" text-anchor="middle">申请单已作废</text><text class="node-sub" x="158" y="656" text-anchor="middle">[申请单状态=已作废]；</text><text class="node-sub" x="158" y="668" text-anchor="middle">微信侧 30 天未处理自动作废（无回调，轮询感知）；</text><text class="node-sub" x="158" y="680" text-anchor="middle">原申请单不可再用</text><rect class="step" x="70" y="840" width="176" height="68" rx="6"/><text class="node-title" x="158" y="864" text-anchor="middle">重新发起进件</text><text class="node-sub" x="158" y="880" text-anchor="middle">新业务编号提交；</text><text class="node-sub" x="158" y="892" text-anchor="middle">[申请单状态=审核中]（新申请单）</text><rect class="success" x="111" y="1028" width="144" height="68" rx="6"/><text class="node-title" x="183" y="1052" text-anchor="middle">异常处理完成</text><text class="node-sub" x="183" y="1068" text-anchor="middle">[申请单状态=审核中]；重新进入正常审核流转</text><rect class="end" x="111" y="1216" width="144" height="44" rx="22"/><text class="node-title end-text" x="183" y="1242" text-anchor="middle">流程结束</text></svg></main></body></html>
