<!-- prototype-states: voucher, soldout, empty -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居民端 · 店铺首页改造</title>
<link rel="stylesheet" href="mobile-components.css">
<link rel="stylesheet" href="mobile-icons.css">
<script src="mobile-components.js" defer></script>
<style>
html,body{margin:0;padding:0;overflow:hidden;height:100%}
/* 头部实景图区（商家详情 2.0 风格） */
.sh-hero{height:200px;background:linear-gradient(160deg,#BFD9F7 0%,#9CC3F0 60%,#7FB0EA 100%);position:relative;overflow:hidden}
.sh-hero-refresh{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;color:#54618a;font-size:14px}
/* 白色信息卡叠压 */
.sh-card{margin:-64px 12px 0;background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(30,50,90,.08);padding:14px;position:relative;z-index:2}
.sh-card-top{display:flex;align-items:flex-start;gap:10px}
.sh-logo{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#ffe3b8,#ffc98a);display:flex;align-items:center;justify-content:center;font-size:22px;color:#c97b2e;flex-shrink:0;font-weight:700}
.sh-name{font-size:19px;font-weight:800;color:#1D2733;letter-spacing:.5px}
.sh-tags{margin-top:8px;display:flex;gap:6px;align-items:center}
.sh-tag-open{font-size:11px;color:var(--m-primary);border:1px solid #9CC3F0;border-radius:4px;padding:1px 6px;line-height:16px;background:#F0F7FF}
.sh-tag-community{font-size:11px;color:#86909C;background:#F2F3F5;border-radius:4px;padding:1px 6px;line-height:16px}
.sh-desc{margin-top:10px;font-size:12px;color:#86909c;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 地址卡（蓝定位 + 黄色圆形电话） */
.sh-addr{display:flex;align-items:center;gap:10px;margin:10px 12px 0;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px rgba(30,50,90,.08)}
.sh-addr .loc{width:32px;height:32px;border-radius:50%;background:#E8F2FF;display:flex;align-items:center;justify-content:center;color:var(--m-primary);flex-shrink:0;font-size:14px}
.sh-addr-main{flex:1;min-width:0}
.sh-addr-text{font-size:13px;color:#1D2733;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.sh-addr-dist{font-size:11px;color:#86909c;margin-top:3px}
.sh-addr-call{width:40px;height:40px;border-radius:50%;background:#FFB938;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
/* 横向 Tab（官方：黑字选中 + 蓝色短下划线） */
.sh-tabs{height:48px;display:flex;align-items:stretch;background:transparent;margin-top:14px;padding:0 4px}
.sh-tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:16px;color:#4E5969;position:relative;background:none;border:0;cursor:pointer;font-weight:500}
.sh-tab.active{color:#1D2733;font-weight:700}
.sh-tab.active::after{content:'';position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:24px;height:3px;border-radius:2px;background:var(--m-primary)}
/* 内容区与券卡（白底简洁） */
.sh-body{background:#fff;border-radius:14px;margin:0 12px 12px;padding:0 14px 14px;min-height:320px}
.mk-voucher{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid #F2F3F5}
.mk-voucher:last-child{border-bottom:0}
.mk-voucher-img{width:72px;height:72px;border-radius:10px;background:#F2F5FA;display:flex;align-items:center;justify-content:center;font-size:24px;color:#C9CDD4;flex-shrink:0}
.mk-voucher-main{flex:1;min-width:0;display:flex;flex-direction:column}
.mk-voucher-title{font-size:14px;font-weight:700;color:#1D2733;line-height:1.4}
.mk-price-row{margin-top:5px;display:flex;align-items:baseline;gap:6px}
.mk-price-now{font-size:18px;font-weight:800;color:#E9305A}
.mk-price-now small{font-size:12px}
.mk-discount{font-size:10px;color:#E9305A;border:1px solid #E9305A;border-radius:3px;padding:0 3px;line-height:14px}
.mk-price-origin{font-size:12px;color:#C9CDD4;text-decoration:line-through}
.mk-voucher-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.mk-sold-tag{font-size:11px;color:#C9CDD4}
.mk-btn-buy{height:32px;padding:0 16px;font-size:13px}
.sh-free-btn{background:#00B578;border-color:#00B578}
.sh-btn-soldout{height:32px;padding:0 16px;font-size:13px;border:1px solid #e5e6eb;border-radius:var(--m-button-radius);background:#f5f6f8;color:#b0b8c4}.sh-empty{padding:48px 0;text-align:center;color:#C9CDD4;font-size:13px}
/* 底部操作栏（电话/立即导航） */
.sh-bottom{display:flex;align-items:center;gap:10px;background:#fff;padding:8px 12px 12px;flex-shrink:0}
.sh-bt-call{flex:1;height:40px;border:1px solid var(--m-border);border-radius:20px;background:#fff;color:#4E5969;font-size:14px}
.sh-bt-nav{flex:2;height:40px;border:0;border-radius:20px;background:linear-gradient(90deg,#4f8cff,#3b6ef2);color:#fff;font-size:14px;font-weight:600}
</style>
</head>
<body>

<div class="yfl-c-root is-blue-nav m-phone">
<div class="m-phone-screen">

  <div class="m-status-bar">
    <span class="time">9:41</span>
    <div class="m-status-icons">
      <svg width="16" height="10" viewBox="0 0 16 10"><rect y="6" width="3" height="4" rx=".5" fill="currentColor"/><rect x="4" y="4" width="3" height="6" rx=".5" fill="currentColor"/><rect x="8" y="2" width="3" height="8" rx=".5" fill="currentColor"/><rect x="12" width="3" height="10" rx=".5" fill="currentColor"/></svg>
      <svg width="22" height="10" viewBox="0 0 22 10"><rect x=".5" y=".5" width="18" height="9" rx="2" fill="none" stroke="currentColor"/><rect x="2" y="2" width="15" height="6" rx="1" fill="currentColor"/><rect x="20" y="3" width="1.5" height="4" rx=".5" fill="currentColor"/></svg>
    </div>
  </div>

  <div class="m-nav-bar">
    <button class="back" aria-label="返回">‹</button>
    <span class="title">商家详情</span>
    <div class="capsule"><div class="capsule-dots"><span></span><span></span><span></span></div><div class="capsule-divider"></div><div class="capsule-close"><span class="capsule-target"></span></div></div>
  </div>

  <div class="m-page-scroll" data-style-ok style="height:calc(100% - 156px);background:#F5F7FA;padding-bottom:56px">
    <!-- 头部实景图区 -->
    <div class="sh-hero">
      <div class="sh-hero-refresh">⟳</div>
    </div>

    <!-- 白色信息卡叠压 -->
    <section class="sh-card">
      <div class="sh-card-top">
        <div class="sh-logo">茶</div>
        <div>
          <div class="sh-name">唐伯伯茶室</div>
          <div class="sh-tags"><span class="sh-tag-open">营业中</span><span class="sh-tag-community">南医大社区</span></div>
        </div>
      </div>
      <div class="sh-desc">因为我们本身就热爱柠檬茶、喜欢喝茶，才决定用心做好这一杯茶。清爽果香与醇厚茶香交织，能瞬间驱散疲惫。</div>
    </section>

    <!-- 地址卡 -->
    <div class="sh-addr">
      <span class="loc">📍</span>
      <div class="sh-addr-main">
        <div class="sh-addr-text">广东省 广州市 白云区 白天鹅花园 麒麟路…</div>
        <div class="sh-addr-dist">距您 7.3 公里</div>
      </div>
      <div class="sh-addr-call">📞</div>
    </div>

    <!-- 横向 Tab -->
    <div class="sh-tabs">
      <button class="sh-tab active">代金券</button>
      <button class="sh-tab">活动推广</button>
      <button class="sh-tab">品牌故事</button>
      <button class="sh-tab">营业信息</button>
    </div>

    <!-- 内容区：代金券券卡列表 -->
    <div class="sh-body" id="voucherBody">
      <article class="mk-voucher">
        <div class="mk-voucher-img">¥</div>
        <div class="mk-voucher-main">
          <div class="mk-voucher-title">唐伯伯茶室40元代50元代金券</div>
          <div class="mk-price-row">
            <span class="mk-price-now"><small>¥</small>40</span>
            <span class="mk-discount">8折</span>
            <span class="mk-price-origin">¥50</span>
          </div>
          <div class="mk-voucher-foot">
            <span class="mk-sold-tag">已售 356</span>
            <button class="m-btn m-btn-primary mk-btn-buy" data-m-action="toast" data-message="进入详情页">购买</button>
          </div>
        </div>
      </article>
      <article class="mk-voucher">
        <div class="mk-voucher-img">¥</div>
        <div class="mk-voucher-main">
          <div class="mk-voucher-title">唐伯伯茶室25元代30元代金券</div>
          <div class="mk-price-row">
            <span class="mk-price-now"><small>¥</small>25</span>
            <span class="mk-discount">8.3折</span>
            <span class="mk-price-origin">¥30</span>
          </div>
          <div class="mk-voucher-foot">
            <span class="mk-sold-tag">已售 89</span>
            <button class="m-btn m-btn-primary mk-btn-buy" data-m-action="toast" data-message="进入详情页">购买</button>
          </div>
        </div>
      </article>
      <article class="mk-voucher">
        <div class="mk-voucher-img">¥</div>
        <div class="mk-voucher-main">
          <div class="mk-voucher-title">唐伯伯茶室15元代20元代金券</div>
          <div class="mk-price-row">
            <span class="mk-price-now"><small>¥</small>15</span>
            <span class="mk-discount">7.5折</span>
            <span class="mk-price-origin">¥20</span>
          </div>
          <div class="mk-voucher-foot">
            <span class="mk-sold-tag">已售 128</span>
            <button class="m-btn m-btn-primary mk-btn-buy" data-m-action="toast" data-message="进入详情页">购买</button>
          </div>
        </div>
      </article>
    </div>
  </div>

  <!-- 底部操作栏（电话/立即导航） -->
  <footer class="m-fixed-actions sh-bottom">
    <button class="sh-bt-call" data-m-action="toast" data-message="拨打商家电话">电话</button>
    <button class="sh-bt-nav" data-m-action="toast" data-message="调起微信导航">立即导航</button>
  </footer>

</div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var st = params.get('state') || 'voucher';
  var body = document.getElementById('voucherBody');
  if (st === 'soldout'){
    body.innerHTML = '<div class="mk-voucher"><div class="mk-voucher-img">¥</div><div class="mk-voucher-main"><div class="mk-voucher-title">唐伯伯茶室40元代50元代金券</div><div class="mk-price-row"><span class="mk-price-now"><small>¥</small>40</span><span class="mk-discount">8折</span><span class="mk-price-origin">¥50</span></div><div class="mk-voucher-foot"><span class="mk-sold-tag">已售罄</span><button class="m-btn mk-btn-buy" disabled class="sh-btn-soldout">已售罄</button></div></div></div>';
  }
  if (st === 'empty'){
    body.innerHTML = '<div class="sh-empty">本店暂无可购买代金券，去市集看看其他好券</div>';
  }
  // Tab 切换视觉
  var tabs = document.querySelectorAll('.sh-tab');
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      tabs.forEach(function(x){ x.classList.remove('active'); });
      tab.classList.add('active');
    });
  });
})();
</script>
</body>
</html>
