<!-- prototype-states: success, fail -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居民端 · 支付结果页</title>
<link rel="stylesheet" href="mobile-components.css">
<link rel="stylesheet" href="mobile-icons.css">
<script src="mobile-components.js" defer></script>
<style>
html,body{margin:0;padding:0;overflow:hidden;height:100%}

.pr-result{background:#fff;padding:34px 16px 20px;text-align:center}
.pr-icon{width:64px;height:64px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
.pr-status{margin-top:14px;font-size:18px;font-weight:800}
.pr-sub{margin-top:6px;font-size:13px;color:#86909c}
.pr-card{margin-top:10px;background:#fff;padding:14px 16px}
.pr-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.pr-row .label{color:#86909c}
.pr-amount{font-size:17px;font-weight:800;color:#e9305a}
.pr-tip{margin-top:10px;font-size:12px;color:#86909c;background:#f7f9fc;border-radius:4px;padding:8px 10px;line-height:1.7;text-align:left}
.pr-actions{margin-top:10px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>

<div class="yfl-c-root is-blue-nav m-phone">
<div class="m-phone-screen">

  <div class="m-status-bar">
    <span class="time">9:41</span>
    <div class="m-status-icons">
      <svg width="16" height="10" viewBox="0 0 16 10"><rect y="6" width="3" height="4" rx=".5" fill="currentColor"/><rect x="4" y="4" width="3" height="6" rx=".5" fill="currentColor"/><rect x="8" y="2" width="3" height="8" rx=".5" fill="currentColor"/><rect x="12" width="3" height="10" rx=".5" fill="currentColor"/></svg>
      <svg width="22" height="10" viewBox="0 0 22 10"><rect x=".5" y=".5" width="18" height="9" rx="2" fill="none" stroke="currentColor"/><rect x="2" y="2" width="15" height="6" rx="1" fill="currentColor"/><rect x="20" y="3" width="1.5" height="4" rx=".5" fill="currentColor"/></svg>
    </div>
  </div>

  <div class="m-nav-bar">
    <button class="back hidden" aria-label="返回">‹</button>
    <span class="title">支付结果</span>
    <div class="capsule"><div class="capsule-dots"><span></span><span></span><span></span></div><div class="capsule-divider"></div><div class="capsule-close"><span class="capsule-target"></span></div></div>
  </div>

  <div class="m-page-scroll">
  <main class="m-page-content">

    <section class="pr-result">
      <div class="pr-icon" id="resultIcon">✓</div>
      <div class="pr-status" id="statusText">支付成功</div>
      <div class="pr-sub" id="subText">40元购得50元代金券，已放入我的订单</div>
    </section>

    <section class="pr-card">
      <div class="pr-row"><span class="label">代金券</span><span class="value">天天简餐40元代50元代金券</span></div>
      <div class="pr-row"><span class="label">实付金额</span><span class="pr-amount">¥40</span></div>
      <div class="pr-row"><span class="label">有效期至</span><span class="value">购买后 22 天内有效</span></div>
    </section>

    <div class="pr-tip">券可在【我的订单】中查看，到店消费出示核销码，商家扫码核销即可抵扣。</div>

    <section class="pr-actions">
      <button class="m-action-primary" data-m-action="toast" data-message="进入订单详情页" id="mainBtn">查看订单</button>
      <button class="m-action-secondary" data-m-action="toast" data-message="返回市集">继续逛逛</button>
    </section>

  </main>
  </div>

</div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var st = params.get('state') || 'success';
  var icon = document.getElementById('resultIcon');
  var statusText = document.getElementById('statusText');
  var subText = document.getElementById('subText');
  var mainBtn = document.getElementById('mainBtn');
  if (st === 'fail'){
    icon.style.background = '#e9305a';
    icon.textContent = '!';
    statusText.textContent = '支付失败';
    subText.textContent = '未扣款，可重新发起支付';
    mainBtn.textContent = '重新支付';
    mainBtn.setAttribute('data-message','拉起微信支付');
  } else {
    icon.style.background = '#00b578';
  }
})();
</script>
</body>
</html>
