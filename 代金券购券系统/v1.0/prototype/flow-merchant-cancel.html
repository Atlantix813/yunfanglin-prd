<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">商家注销子流程</h1><p class="sub">清账校验 → 微信注销申请 → 审核中/驳回/成功；成功后商家状态转已注销，遗留资金全额清退。</p><svg width="100%" viewBox="0 0 1254 1412" role="img" aria-labelledby="merchant-cancel-title merchant-cancel-desc"><title id="merchant-cancel-title">商家注销子流程</title><desc id="merchant-cancel-desc">商家主体级操作：前置清账校验五清单通过后提交微信注销申请；微信审核中→驳回（换单重新提交）或注销成功（账户遗留资金全额清退，商家状态转已注销，可重新进件）。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 412 80 L 412 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 98 256 L 32 256 L 32 498 L 419 498 L 419 576" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 726 256 L 784 256 L 784 400" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 419 632 L 419 1236 L 946 1236 L 946 1304" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 784 456 L 784 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 784 632 L 784 752" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 606 808 L 548 808 L 548 1128" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 962 808 L 1020 808 L 1020 952" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1020 1008 L 1020 1128" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1020 1184 L 1020 1304" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 548 1184 L 548 1226 L 983 1226 L 983 1304" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="45" y="236" width="40" height="12" rx="2"/><text class="edge-label" x="65" y="245" text-anchor="middle">未通过</text><rect class="label-mask" x="739" y="236" width="32" height="12" rx="2"/><text class="edge-label" x="755" y="245" text-anchor="middle">通过</text><rect class="label-mask" x="561" y="788" width="32" height="12" rx="2"/><text class="edge-label" x="577" y="797" text-anchor="middle">驳回</text><rect class="label-mask" x="975" y="788" width="32" height="12" rx="2"/><text class="edge-label" x="991" y="797" text-anchor="middle">成功</text><rect class="start" x="340" y="24" width="144" height="56" rx="28"/><text class="node-title" x="412" y="48" text-anchor="middle">发起注销</text><text class="node-sub" x="412" y="66" text-anchor="middle">商家列表【申请注销】</text><polygon class="decision" points="412,200 726,256 412,312 98,256"/><text class="node-title" x="412" y="251" text-anchor="middle">清账校验是否全部通过？</text><text class="node-sub decision-sub" x="412" y="269" text-anchor="middle">五清单：在售券下架/订单清零/待分账清零/余额提清/无改卡申请</text><rect class="error" x="343" y="576" width="152" height="56" rx="6"/><text class="node-title" x="419" y="600" text-anchor="middle">拦截：先处理未完成项</text><text class="node-sub" x="419" y="618" text-anchor="middle">逐项展示未通过清单</text><rect class="step" x="666" y="400" width="236" height="56" rx="6"/><text class="node-title" x="784" y="424" text-anchor="middle">创建商户注销记录</text><text class="node-sub" x="784" y="442" text-anchor="middle">[注销状态=审核中]；商家主表[商家状态=注销中]</text><rect class="step" x="664" y="576" width="240" height="56" rx="6"/><text class="node-title" x="784" y="600" text-anchor="middle">提交注销申请</text><text class="node-sub" x="784" y="618" text-anchor="middle">上传纸质注销申请书（盖章拍照）；调官方注销接口</text><polygon class="decision" points="784,752 962,808 784,864 606,808"/><text class="node-title" x="784" y="803" text-anchor="middle">注销状态 == 注销成功？</text><text class="node-sub decision-sub" x="784" y="821" text-anchor="middle">微信注销申请单审核完成后判定</text><rect class="error" x="430" y="1128" width="236" height="56" rx="6"/><text class="node-title" x="548" y="1152" text-anchor="middle">审核驳回</text><text class="node-sub" x="548" y="1170" text-anchor="middle">[注销状态=审核驳回]；带驳回原因；换单重新提交</text><rect class="step" x="922" y="952" width="196" height="56" rx="6"/><text class="node-title" x="1020" y="976" text-anchor="middle">遗留资金全额清退</text><text class="node-sub" x="1020" y="994" text-anchor="middle">微信将商户账户遗留资金清退至商家账户</text><rect class="success" x="850" y="1128" width="340" height="56" rx="6"/><text class="node-title" x="1020" y="1152" text-anchor="middle">注销完成</text><text class="node-sub" x="1020" y="1170" text-anchor="middle">[注销状态=注销成功]；商家主表[商家状态=已注销]；重新进件=全新申请单</text><rect class="end" x="911" y="1304" width="144" height="44" rx="22"/><text class="node-title end-text" x="983" y="1330" text-anchor="middle">流程结束</text></svg></main></body></html>
