<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">商家注销子流程</h1><p class="sub">清账校验 → 微信注销申请 → 审核中/驳回/成功；成功后商家状态转已注销，遗留资金全额清退。</p><svg width="100%" viewBox="0 0 1258 1236" role="img" aria-labelledby="merchant-cancel-title merchant-cancel-desc"><title id="merchant-cancel-title">商家注销子流程</title><desc id="merchant-cancel-desc">商家主体级操作：前置清账校验五清单通过后提交微信注销申请；微信审核中→驳回（换单重新提交）或注销成功（账户遗留资金全额清退，商家状态转已注销，可重新进件）。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 488 80 L 488 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 174 256 L 108 256 L 108 400" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 802 256 L 860 256 L 860 400" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 860 456 L 860 576" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 682 632 L 624 632 L 624 776" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 1038 632 L 1096 632 L 1096 776" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1096 832 L 1096 952" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1096 1008 L 1096 1128" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="121" y="236" width="40" height="12" rx="2"/><text class="edge-label" x="141" y="245" text-anchor="middle">未通过</text><rect class="label-mask" x="815" y="236" width="32" height="12" rx="2"/><text class="edge-label" x="831" y="245" text-anchor="middle">通过</text><rect class="label-mask" x="637" y="612" width="32" height="12" rx="2"/><text class="edge-label" x="653" y="621" text-anchor="middle">驳回</text><rect class="label-mask" x="1051" y="612" width="32" height="12" rx="2"/><text class="edge-label" x="1067" y="621" text-anchor="middle">通过</text><rect class="start" x="416" y="24" width="144" height="56" rx="28"/><text class="node-title" x="488" y="48" text-anchor="middle">发起注销</text><text class="node-sub" x="488" y="66" text-anchor="middle">商家列表【申请注销】</text><polygon class="decision" points="488,200 802,256 488,312 174,256"/><text class="node-title" x="488" y="251" text-anchor="middle">清账校验是否全部通过？</text><text class="node-sub decision-sub" x="488" y="269" text-anchor="middle">五清单：在售券下架/订单清零/待分账清零/余额提清/无改卡申请</text><rect class="error" x="32" y="400" width="152" height="56" rx="6"/><text class="node-title" x="108" y="424" text-anchor="middle">拦截：先处理未完成项</text><text class="node-sub" x="108" y="442" text-anchor="middle">逐项展示未通过清单</text><rect class="step" x="740" y="400" width="240" height="56" rx="6"/><text class="node-title" x="860" y="424" text-anchor="middle">提交注销申请</text><text class="node-sub" x="860" y="442" text-anchor="middle">上传纸质注销申请书（盖章拍照）；调官方注销接口</text><polygon class="decision" points="860,576 1038,632 860,688 682,632"/><text class="node-title" x="860" y="627" text-anchor="middle">注销状态 == 审核通过？</text><text class="node-sub decision-sub" x="860" y="645" text-anchor="middle">微信注销申请单审核</text><rect class="error" x="552" y="776" width="144" height="56" rx="6"/><text class="node-title" x="624" y="800" text-anchor="middle">审核驳回</text><text class="node-sub" x="624" y="818" text-anchor="middle">带驳回原因；换单重新提交</text><rect class="step" x="998" y="776" width="196" height="56" rx="6"/><text class="node-title" x="1096" y="800" text-anchor="middle">遗留资金全额清退</text><text class="node-sub" x="1096" y="818" text-anchor="middle">微信将商户账户遗留资金清退至商家账户</text><rect class="success" x="1024" y="952" width="144" height="56" rx="6"/><text class="node-title" x="1096" y="976" text-anchor="middle">商家状态=已注销</text><text class="node-sub" x="1096" y="994" text-anchor="middle">重新进件=全新申请单</text><rect class="end" x="1024" y="1128" width="144" height="44" rx="22"/><text class="node-title end-text" x="1096" y="1154" text-anchor="middle">流程结束</text></svg></main></body></html>
