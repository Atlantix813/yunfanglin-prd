<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{height:100%;margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:24px;overflow:auto;box-sizing:border-box}.title{font-size:18px;font-weight:700;color:#1D2733;margin:0 0 4px}.sub{font-size:12px;color:#86909C;margin:0 0 16px}.edge{fill:none;stroke-width:1.2}.decision{fill:#FFF7EC;stroke:#FF8F1F;stroke-width:1.4}.step{fill:#fff;stroke:#1D2733;stroke-width:1.2}.start{fill:#EBF5FF;stroke:#3491FA;stroke-width:1.2}.end{fill:#F2F3F5;stroke:#86909C;stroke-width:1.2}.end-text{fill:#4E5969}.success{fill:#F0FFF4;stroke:#00B365;stroke-width:1.2}.error{fill:#FFF1F1;stroke:#F53F3F;stroke-width:1.2}.node-title{font-size:12px;font-weight:600;fill:#1D2733}.node-sub{font-size:9px;font-weight:400;fill:#86909C}.decision-sub{fill:#E08A00}.edge-label{font-size:8px;fill:#4E5969}.label-mask{fill:#fff}</style></head><body><main class="wrap"><h1 class="title">商家注销子流程</h1><p class="sub">清账校验 → 微信注销申请 → 审核中/驳回/成功；成功后商家状态转已注销，遗留资金全额清退。</p><svg width="100%" viewBox="0 0 1182 1516" role="img" aria-labelledby="merchant-cancel-title merchant-cancel-desc"><title id="merchant-cancel-title">商家注销子流程</title><desc id="merchant-cancel-desc">商家主体级操作：前置清账校验五清单通过后提交微信注销申请；微信审核中→驳回（换单重新提交）或注销成功（账户遗留资金全额清退，商家状态转已注销，可重新进件）。</desc><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3491FA"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F53F3F"/></marker></defs><path class="edge" d="M 412 80 L 412 200" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 98 270 L 32 270 L 32 538 L 445 538 L 445 628" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 726 270 L 784 270 L 784 428" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 445 684 L 445 1340 L 946 1340 L 946 1408" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 784 496 L 784 616" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 784 684 L 784 804" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 606 874 L 548 874 L 548 1220" stroke="#F53F3F" marker-end="url(#arrow-red)"/><path class="edge" d="M 962 874 L 1020 874 L 1020 1032" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1020 1088 L 1020 1208" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 1020 1288 L 1020 1408" stroke="#3491FA" marker-end="url(#arrow-blue)"/><path class="edge" d="M 548 1288 L 548 1330 L 983 1330 L 983 1408" stroke="#3491FA" marker-end="url(#arrow-blue)"/><rect class="label-mask" x="45" y="250" width="40" height="12" rx="2"/><text class="edge-label" x="65" y="259" text-anchor="middle">未通过</text><rect class="label-mask" x="739" y="250" width="32" height="12" rx="2"/><text class="edge-label" x="755" y="259" text-anchor="middle">通过</text><rect class="label-mask" x="561" y="854" width="32" height="12" rx="2"/><text class="edge-label" x="577" y="863" text-anchor="middle">驳回</text><rect class="label-mask" x="975" y="854" width="32" height="12" rx="2"/><text class="edge-label" x="991" y="863" text-anchor="middle">成功</text><rect class="start" x="340" y="24" width="144" height="56" rx="28"/><text class="node-title" x="412" y="48" text-anchor="middle">发起注销</text><text class="node-sub" x="412" y="64" text-anchor="middle">商家列表【申请注销】</text><polygon class="decision" points="412,200 726,270 412,340 98,270"/><text class="node-title" x="412" y="265" text-anchor="middle">清账校验是否全部通过？</text><text class="node-sub decision-sub" x="412" y="280" text-anchor="middle">五清单：在售券下架/订单清零/待分账清零/余额提清/无改卡申请</text><rect class="error" x="369" y="628" width="152" height="56" rx="6"/><text class="node-title" x="445" y="652" text-anchor="middle">拦截：先处理未完成项</text><text class="node-sub" x="445" y="668" text-anchor="middle">逐项展示未通过清单</text><rect class="step" x="710" y="428" width="148" height="68" rx="6"/><text class="node-title" x="784" y="452" text-anchor="middle">创建商户注销记录</text><text class="node-sub" x="784" y="468" text-anchor="middle">[注销状态=审核中]；</text><text class="node-sub" x="784" y="480" text-anchor="middle">商家主表[商家状态=注销中]</text><rect class="step" x="696" y="616" width="176" height="68" rx="6"/><text class="node-title" x="784" y="640" text-anchor="middle">提交注销申请</text><text class="node-sub" x="784" y="656" text-anchor="middle">上传纸质注销申请书（盖章拍照）；调官方注销接口</text><polygon class="decision" points="784,804 962,874 784,944 606,874"/><text class="node-title" x="784" y="869" text-anchor="middle">注销状态 == 注销成功？</text><text class="node-sub decision-sub" x="784" y="884" text-anchor="middle">微信注销申请单审核完成后判定</text><rect class="error" x="456" y="1220" width="184" height="68" rx="6"/><text class="node-title" x="548" y="1244" text-anchor="middle">审核驳回</text><text class="node-sub" x="548" y="1260" text-anchor="middle">[注销状态=审核驳回]；带驳回原因；</text><text class="node-sub" x="548" y="1272" text-anchor="middle">换单重新提交</text><rect class="step" x="922" y="1032" width="196" height="56" rx="6"/><text class="node-title" x="1020" y="1056" text-anchor="middle">遗留资金全额清退</text><text class="node-sub" x="1020" y="1072" text-anchor="middle">微信将商户账户遗留资金清退至商家账户</text><rect class="success" x="942" y="1208" width="156" height="80" rx="6"/><text class="node-title" x="1020" y="1232" text-anchor="middle">注销完成</text><text class="node-sub" x="1020" y="1248" text-anchor="middle">[注销状态=注销成功]；</text><text class="node-sub" x="1020" y="1260" text-anchor="middle">商家主表[商家状态=已注销]；</text><text class="node-sub" x="1020" y="1272" text-anchor="middle">重新进件=全新申请单</text><rect class="end" x="911" y="1408" width="144" height="44" rx="22"/><text class="node-title end-text" x="983" y="1434" text-anchor="middle">流程结束</text></svg></main></body></html>
