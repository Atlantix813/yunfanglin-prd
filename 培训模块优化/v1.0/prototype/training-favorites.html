<!-- prototype-states: list, empty -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教培系统 · 我的收藏</title>
<link rel="stylesheet" href="mobile-components.css">
<link rel="stylesheet" href="mobile-icons.css">
<script src="mobile-components.js" defer></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  .fav-page { height: 100%; display: flex; flex-direction: column; background: #F6F8FB; }
  .fav-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .fav-scroll::-webkit-scrollbar { display: none; }

  .fav-list { padding: 12px 16px 24px; }
  .fav-course {
    padding: 14px 12px; margin-bottom: 10px; border-radius: 12px; background: #fff;
    box-shadow: 0 2px 8px rgba(30,50,90,.05); display: flex; gap: 12px; align-items: center;
  }
  .fav-course-cover {
    width: 84px; height: 60px; flex-shrink: 0; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--c1), var(--c2)); color: rgba(255,255,255,.92);
  }
  .fav-course-cover .yfl-icon { color: rgba(255,255,255,.92); }
  .fav-course-main { flex: 1; min-width: 0; }
  .fav-course-name {
    font-size: 15px; line-height: 21px; color: #222835; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .fav-course-meta { margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .fav-course-cat { color: #B0B8C8; font-size: 11px; }
  .fav-longpress-tip { margin: 4px 16px 0; text-align: center; color: #B0B8C8; font-size: 11px; }

  /* 长按删除确认弹窗 */
  .fav-delete-overlay {
    position: absolute; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.42);
  }
  .fav-delete-overlay.show { display: flex; }
  .fav-delete-box {
    width: 280px; overflow: hidden; border-radius: 14px; background: #fff;
  }
  .fav-delete-body { padding: 24px 20px; text-align: center; font-size: 15px; line-height: 24px; color: #222835; }
  .fav-delete-actions { display: flex; border-top: 1px solid #F2F3F5; }
  .fav-delete-actions button { flex: 1; height: 46px; border: 0; background: #fff; color: #222835; font-size: 15px; }
  .fav-delete-actions button + button { border-left: 1px solid #F2F3F5; color: #F53F3F; font-weight: 700; }

  /* 空状态 */
  .fav-empty { padding: 70px 20px; text-align: center; color: #B0B8C8; }
  .fav-empty-icon {
    width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%;
    background: #F4F6FA; color: #C6D0DE;
    display: flex; align-items: center; justify-content: center;
  }
  .fav-empty-text { font-size: 13px; }
  .fav-empty-btn { margin-top: 18px; display: inline-flex; }
</style>
</head>
<body>
<div class="yfl-c-root m-phone">
  <div class="m-phone-screen fav-page">

    <div class="m-status-bar">
      <span class="time">9:41</span>
      <div class="m-status-icons" aria-hidden="true">
        <svg data-inline-svg-ok width="16" height="10" viewBox="0 0 16 10" fill="currentColor"><rect x="0" y="7" width="2.5" height="3" rx=".5"/><rect x="4" y="5" width="2.5" height="5" rx=".5"/><rect x="8" y="2.5" width="2.5" height="7.5" rx=".5"/><rect x="12" y="0" width="2.5" height="10" rx=".5"/></svg>
        <svg data-inline-svg-ok width="23" height="10" viewBox="0 0 23 10" fill="none"><rect x=".5" y=".5" width="19" height="9" rx="2" stroke="currentColor"/><rect x="2.5" y="2.5" width="15" height="5" rx="1" fill="currentColor"/><path d="M21 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div class="m-nav-bar">
      <button class="back" aria-label="返回" onclick="window.YunFangLinC && window.YunFangLinC.showToast(document.body, '返回我的页')">‹</button>
      <span class="title">我的收藏</span>
      <div class="capsule" aria-label="小程序菜单">
        <div class="capsule-dots"><span></span><span></span><span></span></div>
        <div class="capsule-divider"></div>
        <div class="capsule-close"><span class="capsule-target"></span></div>
      </div>
    </div>

    <div class="fav-scroll">
      <div class="fav-list" id="favList">
        <div class="fav-course" data-name="社区合伙人政策与准入规则">
          <div class="fav-course-cover" style="--c1:#35B3FF;--c2:#13B4A9"><span class="yfl-icon yfl-icon--24" data-icon="service" aria-hidden="true"></span></div>
          <div class="fav-course-main">
            <div class="fav-course-name">社区合伙人政策与准入规则</div>
            <div class="fav-course-meta">
              <span class="fav-course-cat">社区治理 · 矛盾调解</span>
            </div>
          </div>
        </div>
        <div class="fav-course" data-name="社区服务站日常巡查与记录规范">
          <div class="fav-course-cover" style="--c1:#7348FF;--c2:#C236C9"><span class="yfl-icon yfl-icon--24" data-icon="service" aria-hidden="true"></span></div>
          <div class="fav-course-main">
            <div class="fav-course-name">社区服务站日常巡查与记录规范</div>
            <div class="fav-course-meta">
              <span class="fav-course-cat">社区治理 · 居民协商</span>
            </div>
          </div>
        </div>
        <div class="fav-course" data-name="消防安全检查实务">
          <div class="fav-course-cover" style="--c1:#FFA617;--c2:#FF6332"><span class="yfl-icon yfl-icon--24" data-icon="alert" aria-hidden="true"></span></div>
          <div class="fav-course-main">
            <div class="fav-course-name">消防安全检查实务</div>
            <div class="fav-course-meta">
              <span class="fav-course-cat">安全应急 · 消防安全</span>
            </div>
          </div>
        </div>
      </div>
      <div class="fav-longpress-tip">长按课程卡片可删除收藏</div>

      <div class="fav-empty" id="favEmpty" hidden>
        <div class="fav-empty-icon"><span class="yfl-icon yfl-icon--24" data-icon="heart" aria-hidden="true"></span></div>
        <div class="fav-empty-text">还没有收藏课程<br>去首页逛逛，收藏感兴趣的课程吧</div>
        <button class="m-btn m-btn-primary fav-empty-btn" data-m-action="toast" data-message="返回学习首页">去逛逛</button>
      </div>
    </div>

    <!-- 长按删除确认弹窗 -->
    <div class="fav-delete-overlay" id="favDeleteOverlay">
      <div class="fav-delete-box">
        <div class="fav-delete-body">确认取消收藏<br><strong id="favDeleteName">该课程</strong>？</div>
        <div class="fav-delete-actions">
          <button id="favDeleteCancel">取消</button>
          <button id="favDeleteConfirm">删除</button>
        </div>
      </div>
    </div>
    <div class="m-toast"></div>
  </div>
</div>

<script>
  (function () {
    const params = new URLSearchParams(location.search);
    const allowedStates = ['list', 'empty'];
    const initialState = allowedStates.includes(params.get('state')) ? params.get('state') : 'list';
    const favList = document.getElementById('favList');
    const favEmpty = document.getElementById('favEmpty');
    const overlay = document.getElementById('favDeleteOverlay');
    const deleteName = document.getElementById('favDeleteName');
    let pendingCard = null;

    if (initialState === 'empty') {
      favList.hidden = true;
      favEmpty.hidden = false;
      document.querySelector('.fav-longpress-tip').hidden = true;
    }

    // 长按课程卡片触发删除确认（600ms）
    document.querySelectorAll('.fav-course').forEach(function (card) {
      let timer = null;
      card.addEventListener('touchstart', function () {
        timer = setTimeout(function () {
          pendingCard = card;
          deleteName.textContent = card.dataset.name;
          overlay.classList.add('show');
        }, 600);
      });
      card.addEventListener('touchend', function () { clearTimeout(timer); });
      card.addEventListener('touchmove', function () { clearTimeout(timer); });
      card.addEventListener('click', function () {
        window.YunFangLinC && window.YunFangLinC.showToast(document.body, '进入课程详情');
      });
    });

    document.getElementById('favDeleteCancel').addEventListener('click', function () {
      overlay.classList.remove('show');
      pendingCard = null;
    });
    document.getElementById('favDeleteConfirm').addEventListener('click', function () {
      overlay.classList.remove('show');
      if (pendingCard) {
        pendingCard.remove();
        window.YunFangLinC && window.YunFangLinC.showToast(document.body, '已取消收藏');
      }
      pendingCard = null;
    });

    const url = new URL(location.href);
    url.searchParams.set('state', initialState);
    history.replaceState(null, '', url);
  })();
</script>
</body>
</html>
